<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>حساباتي - إدارة مالية احترافية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ====== RESET & BASE ====== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #007AFF;
      --primary-dark: #0055CC;
      --primary-light: #409CFF;
      --secondary: #5856D6;
      --success: #34C759;
      --danger: #FF3B30;
      --warning: #FF9500;
      --gray: #8E8E93;
      --gray-light: #C7C7CC;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a1a;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 100px;
    }

    /* ====== IOS STYLE BACKGROUND ====== */
    .bg-ios {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 20% 50%, rgba(0, 122, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(88, 86, 214, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(52, 199, 89, 0.04) 0%, transparent 50%);
    }

    .bg-ios::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
      opacity: 0.3;
    }

    /* ====== GLASS EFFECT ====== */
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    /* ====== SCROLLBAR ====== */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* ====== IOS BUTTONS ====== */
    .btn-ios {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: 14px;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-ios:active {
      transform: scale(0.96);
    }

    .btn-ios-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3);
    }

    .btn-ios-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 6px 24px rgba(0, 122, 255, 0.4);
      transform: translateY(-1px);
    }

    .btn-ios-success {
      background: var(--success);
      color: white;
      box-shadow: 0 4px 16px rgba(52, 199, 89, 0.3);
    }

    .btn-ios-success:hover {
      background: #2DB84E;
      box-shadow: 0 6px 24px rgba(52, 199, 89, 0.4);
      transform: translateY(-1px);
    }

    .btn-ios-danger {
      background: var(--danger);
      color: white;
      box-shadow: 0 4px 16px rgba(255, 59, 48, 0.3);
    }

    .btn-ios-danger:hover {
      background: #E0352B;
      box-shadow: 0 6px 24px rgba(255, 59, 48, 0.4);
      transform: translateY(-1px);
    }

    .btn-ios-ghost {
      background: rgba(255, 255, 255, 0.06);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-ios-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-ios-small {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn-ios-icon {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-ios-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* ====== IOS INPUT ====== */
    .input-ios {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-ios:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
    }

    .input-ios::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* ====== SELECT ====== */
    .select-ios {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
      appearance: none;
      cursor: pointer;
    }

    .select-ios:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
    }

    .select-ios option {
      background: #1a1a2e;
      color: #fff;
    }

    /* ====== ANIMATIONS ====== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .animate-slide-up {
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* ====== LAYOUT ====== */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 30px;
      min-height: 100vh;
    }

    /* ====== IOS HEADER ====== */
    .header-ios {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header-ios .title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .header-ios .title .accent {
      color: var(--primary);
    }

    .header-ios .actions {
      display: flex;
      gap: 6px;
    }

    /* ====== IOS BALANCE CARD ====== */
    .balance-ios {
      padding: 24px 24px 20px;
      margin-bottom: 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(0, 122, 255, 0.12), rgba(88, 86, 214, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .balance-ios::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(0, 122, 255, 0.06), transparent 70%);
      pointer-events: none;
    }

    .balance-ios .label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .balance-ios .amount {
      font-size: 34px;
      font-weight: 700;
      color: #fff;
      margin: 4px 0 12px;
      letter-spacing: -0.5px;
    }

    .balance-ios .currencies {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .balance-ios .currencies .chip {
      padding: 4px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .balance-ios .currencies .chip strong {
      color: #fff;
      font-weight: 600;
    }

    /* ====== IOS STATS ====== */
    .stats-ios {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-ios {
      padding: 14px 10px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.3s ease;
    }

    .stat-ios:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .stat-ios .value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .stat-ios .label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    /* ====== ACCOUNT CARD IOS ====== */
    .account-ios {
      padding: 16px 18px;
      margin-bottom: 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .account-ios:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(-4px);
      border-color: rgba(0, 122, 255, 0.15);
    }

    .account-ios .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .account-ios .name {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .account-ios .badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .account-ios .balances {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .account-ios .balances .b {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }

    .account-ios .balances .b strong {
      color: #fff;
      font-weight: 600;
    }

    .account-ios .line {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 0 4px 4px 0;
    }

    /* ====== TRANSACTION ITEM IOS ====== */
    .tx-ios {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
    }

    .tx-ios:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .tx-ios .icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .tx-ios .icon.deposit {
      background: rgba(52, 199, 89, 0.12);
    }
    .tx-ios .icon.withdraw {
      background: rgba(255, 59, 48, 0.12);
    }
    .tx-ios .icon.transfer {
      background: rgba(0, 122, 255, 0.12);
    }

    .tx-ios .info {
      flex: 1;
      min-width: 0;
    }

    .tx-ios .info .title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .tx-ios .info .sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 1px;
    }

    .tx-ios .amount {
      font-weight: 700;
      font-size: 15px;
    }

    .tx-ios .amount.pos {
      color: var(--success);
    }
    .tx-ios .amount.neg {
      color: var(--danger);
    }
    .tx-ios .amount.neu {
      color: var(--primary-light);
    }

    .tx-ios .del {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.12);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      transition: all 0.3s ease;
    }

    .tx-ios .del:hover {
      color: var(--danger);
    }

    /* ====== BOTTOM NAV IOS ====== */
    .nav-ios {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 6px 6px;
      display: flex;
      gap: 2px;
      background: rgba(20, 20, 40, 0.85);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      max-width: 360px;
      width: calc(100% - 32px);
    }

    .nav-ios .item {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.3);
      font-family: 'Cairo', sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 22px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      letter-spacing: 0.3px;
    }

    .nav-ios .item .ico {
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .nav-ios .item.active {
      color: #fff;
      background: rgba(0, 122, 255, 0.2);
    }

    .nav-ios .item.active .ico {
      transform: scale(1.05);
    }

    .nav-ios .item:hover:not(.active) {
      color: rgba(255, 255, 255, 0.6);
    }

    /* ====== FAB BUTTONS (الثابتة في كل الشاشات) ====== */
    .fab-container {
      position: fixed;
      bottom: 100px;
      right: 20px;
      z-index: 45;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-end;
    }

    .fab-main {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 6px 30px rgba(0, 122, 255, 0.45);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fab-main:hover {
      transform: scale(1.06);
      box-shadow: 0 8px 40px rgba(0, 122, 255, 0.55);
    }

    .fab-main:active {
      transform: scale(0.92);
    }

    .fab-transfer {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--success), #059669);
      color: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(52, 199, 89, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fab-transfer:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 28px rgba(52, 199, 89, 0.5);
    }

    .fab-transfer:active {
      transform: scale(0.92);
    }

    /* ====== MODAL IOS ====== */
    .modal-ios {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-ios .sheet {
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px 20px 20px;
      border-radius: 28px 28px 20px 20px;
      background: rgba(20, 20, 40, 0.92);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-ios .sheet .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-ios .sheet .head h2 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .modal-ios .sheet .head .close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.4);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-ios .sheet .head .close:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* ====== STEP INDICATOR IOS ====== */
    .step-ios {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .step-ios .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.4s ease;
    }

    .step-ios .dot.active {
      background: var(--primary);
      width: 24px;
      border-radius: 3px;
    }

    .step-ios .dot.done {
      background: var(--success);
    }

    .step-ios .label {
      text-align: center;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.3);
      margin-bottom: 14px;
    }

    /* ====== EMPTY STATE ====== */
    .empty-ios {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-ios .icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
      opacity: 0.4;
    }

    .empty-ios h3 {
      font-size: 17px;
      color: #fff;
      font-weight: 600;
    }

    .empty-ios p {
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      margin-top: 4px;
    }

    /* ====== TOAST ====== */
    .toast-ios {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      padding: 14px 28px;
      border-radius: 14px;
      background: rgba(52, 199, 89, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 32px rgba(52, 199, 89, 0.25);
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      color: #fff;
      font-size: 15px;
      animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ====== RESPONSIVE ====== */
    @media (min-width: 640px) {
      .modal-ios {
        align-items: center;
      }
      .modal-ios .sheet {
        border-radius: 28px;
      }
    }

    @media (max-width: 400px) {
      .stats-ios {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .stat-ios .value {
        font-size: 16px;
      }
      .balance-ios .amount {
        font-size: 26px;
      }
      .fab-main {
        width: 52px;
        height: 52px;
        font-size: 26px;
      }
      .fab-transfer {
        width: 44px;
        height: 44px;
        font-size: 18px;
      }
    }

    /* ====== UTILITIES ====== */
    .flex {
      display: flex;
    }
    .flex-col {
      flex-direction: column;
    }
    .items-center {
      align-items: center;
    }
    .justify-between {
      justify-content: space-between;
    }
    .justify-center {
      justify-content: center;
    }
    .gap-2 {
      gap: 8px;
    }
    .gap-3 {
      gap: 12px;
    }
    .gap-4 {
      gap: 16px;
    }
    .flex-1 {
      flex: 1;
    }
    .w-full {
      width: 100%;
    }
    .text-center {
      text-align: center;
    }
    .text-white {
      color: #fff;
    }
    .text-sm {
      font-size: 13px;
    }
    .text-xs {
      font-size: 11px;
    }
    .mt-2 {
      margin-top: 8px;
    }
    .mt-3 {
      margin-top: 12px;
    }
    .mt-4 {
      margin-top: 16px;
    }
    .mb-2 {

</head>
<body>

  <!-- ====== IOS BACKGROUND ====== -->
  <div class="bg-ios"></div>

  <!-- ====== APP ====== -->
  <div id="app">
    <div class="app-container" id="app-container"></div>
  </div>

  <!-- ====== FAB BUTTONS (الثابتة في كل الشاشات) ====== -->
  <div class="fab-container" id="fabContainer">
    <button class="fab-transfer" id="fabTransfer" onclick="openModal('transfer')" title="تحويل بين الحسابات" style="display:none;">⇄</button>
    <button class="fab-main" id="fabMain" onclick="openModal('addTransaction')" title="إضافة معاملة">+</button>
  </div>

  <!-- ====== BOTTOM NAV ====== -->
  <nav class="nav-ios" id="bottom-nav"></nav>

  <script>
    // ============================================================
    // ====== DATA ======
    // ============================================================

    const CURRENCIES = [
      { value: 'USD', label: 'دولار', symbol: '$', flag: '🇺🇸' },
      { value: 'TRY', label: 'ليرا', symbol: '₺', flag: '🇹🇷' },
      { value: 'EUR', label: 'يورو', symbol: '€', flag: '🇪🇺' },
    ];

    const REASONS = [
      { value: 'rent', label: 'إيجار', icon: '🏠' },
      { value: 'internet', label: 'إنترنت', icon: '🌐' },
      { value: 'electricity', label: 'كهرباء', icon: '⚡' },
      { value: 'gas', label: 'غاز', icon: '🔥' },
      { value: 'personal', label: 'شخصي', icon: '👤' },
      { value: 'apartment', label: 'الشقة', icon: '🏢' },
      { value: 'metro', label: 'مترو', icon: '🚇' },
      { value: 'other', label: 'أخرى', icon: '📌' },
    ];

    const ACCOUNT_COLORS = ['#007AFF', '#34C759', '#FF9500', '#FF3B30', '#5856D6', '#FF2D55'];
    const ACCOUNT_ICONS = ['👛', '🐷', '🏢', '🏛️', '🪙', '💵'];

    const TABS = [
      { id: 'home', label: 'الرئيسية', icon: '🏠' },
      { id: 'transactions', label: 'المعاملات', icon: '📋' },
      { id: 'reports', label: 'التقارير', icon: '📊' },
    ];

    const STORAGE_KEY = 'finance_ios_data_v3';

    let state = { accounts: [], transactions: [] };
    let currentTab = 'home';
    let selectedAccountId = null;
    let modals = { createAccount: false, addTransaction: false, transfer: false, settings: false };
    let txStep = 1;
    let txData = { type: 'deposit', accountId: '', currency: 'USD', reason: '', amount: 0, note: '', toAccountId: '',
      exchangeRate: 0 };
    let transferData = { fromAccountId: '', toAccountId: '', fromCurrency: 'USD', toCurrency: 'TRY', amount: 0,
      exchangeRate: 0, convertedAmount: 0 };

    // ============================================================
    // ====== HELPERS ======
    // ============================================================

    function $(s, c = document) { return c.querySelector(s); }

    function $$(s, c = document) { return [...c.querySelectorAll(s)]; }

    function id() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

    function getAccount(id) { return state.accounts.find(a => a.id === id); }

    function getTransactions(accountId) {
      return state.transactions.filter(t => t.accountId === accountId || t.toAccountId === accountId);
    }

    function getTotalBalance() {
      const t = { USD: 0, TRY: 0, EUR: 0 };
      state.accounts.forEach(a => {
        Object.entries(a.currencies || {}).forEach(([c, v]) => { if (t[c] !== undefined) t[c] += v; });
      });
      return t;
    }

    function formatNum(n) { return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function formatDate(d) {
      return new Date(d).toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function curInfo(c) { return CURRENCIES.find(x => x.value === c); }

    function reasonInfo(r) { return REASONS.find(x => x.value === r); }

    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.error(e); }
    }

    function loadData() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) { const d = JSON.parse(s);
          state.accounts = d.accounts || [];
          state.transactions = d.transactions || []; }
      } catch (e) { console.error(e); }
    }

    // ============================================================
    // ====== TOAST ======
    // ============================================================

    function showToast(msg) {
      const old = $('#toast');
      if (old) old.remove();
      const el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast-ios';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => { el.style.opacity = '0';
        el.style.transition = 'opacity 0.4s';
        setTimeout(() => el.remove(), 400); }, 1800);
    }

    // ============================================================
    // ====== MODAL HELPERS ======
    // ============================================================

    function openModal(id) {
      modals[id] = true;
      document.body.style.overflow = 'hidden';
      renderAll();
    }

    function closeModal(id) {
      modals[id] = false;
      document.body.style.overflow = '';
      renderAll();
    }

    // ============================================================
    // ====== ACCOUNT OPERATIONS ======
    // ============================================================

    function addAccount(data) {
      const acc = {
        id: id(),
        name: data.name.trim(),
        currencies: data.currencies || {},
        color: data.color || ACCOUNT_COLORS[0],
        icon: data.icon || ACCOUNT_ICONS[0],
        createdAt: new Date().toISOString(),
      };
      state.accounts.push(acc);
      saveData();
      closeModal('createAccount');
      showToast('✅ تم إنشاء الحساب بنجاح');
      renderAll();
    }

    function deleteAccount(id) {
      if (!confirm('حذف الحساب؟')) return;
      state.accounts = state.accounts.filter(a => a.id !== id);
      state.transactions = state.transactions.filter(t => t.accountId !== id && t.toAccountId !== id);
      saveData();
      if (selectedAccountId === id) selectedAccountId = null;
      showToast('🗑️ تم حذف الحساب');
      renderAll();
    }

    // ============================================================
    // ====== TRANSACTION OPERATIONS ======
    // ============================================================

    function addTransaction(data) {
      const tx = {
        id: id(),
        type: data.type,
        accountId: data.accountId,
        currency: data.currency,
        amount: data.amount,
        reason: data.reason,
        note: data.note || '',
        date: new Date().toISOString(),
        toAccountId: data.toAccountId || null,
        exchangeRate: data.exchangeRate || null,
        convertedAmount: null,
        targetCurrency: null,
      };

      let accs = [...state.accounts];

      if (data.type === 'deposit') {
        accs = accs.map(a => a.id === data.accountId ? {
          ...a,
          currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) + data.amount }
        } : a);
      } else if (data.type === 'withdraw') {
        accs = accs.map(a => a.id === data.accountId ? {
          ...a,
          currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) - data.amount }
        } : a);
      } else if (data.type === 'transfer' && data.toAccountId && data.exchangeRate) {
        const converted = data.amount * data.exchangeRate;
        let targetCur = 'USD';
        const toAcc = getAccount(data.toAccountId);
        if (toAcc) {
          const avail = Object.keys(toAcc.currencies || {});
          if (avail.length > 0) {
            targetCur = avail[0];
          }
        }
        tx.convertedAmount = converted;
        tx.targetCurrency = targetCur;
        accs = accs.map(a => {
          if (a.id === data.accountId) {
            return { ...a, currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) - data
                  .amount } };
          }
          if (a.id === data.toAccountId) {
            return { ...a, currencies: { ...a.currencies, [targetCur]: (a.currencies[targetCur] || 0) + converted } };
          }
          return a;
        });
      }

      state.accounts = accs;
      state.transactions = [tx, ...state.transactions];
      saveData();
      showToast('✅ تمت المعاملة بنجاح');
      renderAll();
    }

    function deleteTransaction(id) {
      if (!confirm('حذف المعاملة؟')) return;
      state.transactions = state.transactions.filter(t => t.id !== id);
      saveData();
      showToast('🗑️ تم حذف المعاملة');
      renderAll();
    }

    // ============================================================
    // ====== EXPORT / IMPORT ======
    // ============================================================

    function exportData() {
      const data = { accounts: state.accounts, transactions: state.transactions, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `finance_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📤 تم تصدير البيانات');
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const d = JSON.parse(e.target.result);
          if (d.accounts && d.transactions) {
            state.accounts = d.accounts;
            state.transactions = d.transactions;
            saveData();
            renderAll();
            showToast(`✅ تم استيراد ${d.accounts.length} حسابات`);
          } else {
            showToast('❌ ملف غير صالح');
          }
        } catch (err) { showToast('❌ خطأ في الاستيراد'); }
      };
      reader.readAsText(file);
    }

    function triggerImport() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = function() { if (this.files && this.files[0]) importData(this.files[0]); };
      input.click();
    }

    // ============================================================
    // ====== FAB VISIBILITY ======
    // ============================================================

    function updateFabs() {
      const fabMain = $('#fabMain');
      const fabTransfer = $('#fabTransfer');
      if (fabMain) {
        fabMain.style.display = state.accounts.length > 0 ? 'flex' : 'none';
      }
      if (fabTransfer) {
        fabTransfer.style.display = state.accounts.length > 1 ? 'flex' : 'none';
      }
    }

    // ============================================================
    // ====== RENDER ======
    // ============================================================

    function renderAll() {
      renderApp();
      renderNav();
      renderModals();
      updateFabs();
    }

    function renderNav() {
      const container = $('#bottom-nav');
      if (!container) return;
      container.innerHTML = TABS.map(t => `
        <button class="item ${currentTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">
          <span class="ico">${t.icon}</span>
          <span>${t.label}</span>
        </button>
      `).join('');
    }

    function renderApp() {
      const container = $('#app-container');
      if (!container) return;

      let html = '';

      // Header
      html += `
        <div class="header-ios animate-fade-up">
          <span class="title">${selectedAccountId ? '' : 'حسابات<span class="accent">ي</span>'}</span>
          <div class="actions">
            <button class="btn-ios-icon" onclick="openModal('settings')">⚙</button>
          </div>
        </div>
      `;

      if (selectedAccountId) {
        html += renderAccountDetail();
      } else {
        switch (currentTab) {
          case 'home':
            html += renderHome();
            break;
          case 'transactions':
            html += renderTransactions();
            break;
          case 'reports':
            html += renderReports();
            break;
        }
      }

      container.innerHTML = html;
    }

    // ============================================================
    // ====== HOME ======
    // ============================================================

    function renderHome() {
      const totals = getTotalBalance();
      const hasBal = totals.USD > 0 || totals.TRY > 0 || totals.EUR > 0;

      let html = '';

      // Balance
      html += `
        <div class="balance-ios animate-fade-up">
          <div class="label">الرصيد الإجمالي</div>
          <div class="amount">${hasBal ? '' : '0.00'}</div>
          <div class="currencies">
            ${CURRENCIES.filter(c => totals[c.value] > 0).map(c => `
              <span class="chip">${c.flag} <strong>${c.symbol}${formatNum(totals[c.value])}</strong></span>
            `).join('')}
            ${!hasBal ? '<span class="chip" style="color:rgba(255,255,255,0.2);">لا توجد أرصدة</span>' : ''}
          </div>
        </div>
      `;

      // Stats
      html += `
        <div class="stats-ios">
          <div class="stat-ios">
            <div class="value">${state.accounts.length}</div>
            <div class="label">حسابات</div>
          </div>
          <div class="stat-ios">
            <div class="value">${Object.values(totals).filter(v => v > 0).length}</div>
            <div class="label">عملات</div>
          </div>
          <div class="stat-ios">
            <div class="value">${state.transactions.length}</div>
            <div class="label">معاملات</div>
          </div>
        </div>
      `;

      // Create Account
      html += `
        <button class="btn-ios btn-ios-primary w-full mb-4" onclick="openModal('createAccount')">
          <span style="font-size:18px;">+</span> حساب جديد
        </button>
      `;

      // Accounts
      if (state.accounts.length === 0) {
        html += `
          <div class="empty-ios glass" style="border-radius:20px;padding:40px 20px;">
            <span class="icon">👛</span>
            <h3>لا توجد حسابات</h3>
            <p>أضف حسابك الأول</p>
          </div>
        `;
      } else {
        state.accounts.forEach((acc, i) => {
          const icon = acc.icon || ACCOUNT_ICONS[i % ACCOUNT_ICONS.length];
          const color = acc.color || ACCOUNT_COLORS[i % ACCOUNT_COLORS.length];
          html += `
            <div class="account-ios animate-fade-up" style="animation-delay:${i * 0.04}s" onclick="selectAccount('${acc.id}')">
              <div class="line" style="background:${color};"></div>
              <div class="row">
                <span class="name">${acc.name}</span>
                <div class="badge" style="background:${color}22;">${icon}</div>
              </div>
              <div class="balances">
                ${Object.entries(acc.currencies || {}).filter(([,v]) => v > 0).map(([c, v]) => {
                  const info = curInfo(c);
                  return `<span class="b">${info?.flag || ''} <strong>${info?.symbol || ''}${formatNum(v)}</strong></span>`;
                }).join('')}
                ${Object.values(acc.currencies || {}).every(v => v === 0) ? '<span class="b" style="color:rgba(255,255,255,0.2);">لا توجد أرصدة</span>' : ''}
              </div>
            </div>
          `;
        });
      }

      return html;
    }

    // ============================================================
    // ====== ACCOUNT DETAIL ======
    // ============================================================

    function renderAccountDetail() {
      const acc = getAccount(selectedAccountId);
      if (!acc) { selectedAccountId = null; return ''; }

      const icon = acc.icon || '👛';
      const color = acc.color || '#007AFF';
      const txs = getTransactions(acc.id);

      let html = `
        <div class="animate-fade-up">
          <button class="btn-ios btn-ios-ghost btn-ios-small mb-3" onclick="selectedAccountId=null;renderAll()">← رجوع</button>

          <div class="balance-ios" style="background:linear-gradient(135deg, ${color}18, rgba(255,255,255,0.02));border-color:${color}33;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
              <span style="font-size:28px;">${icon}</span>
              <span style="font-size:20px;font-weight:700;">${acc.name}</span>
            </div>
            <div class="currencies">
              ${CURRENCIES.filter(c => (acc.currencies?.[c.value] || 0) > 0).map(c => `
                <span class="chip">${c.flag} <strong>${c.symbol}${formatNum(acc.currencies?.[c.value] || 0)}</strong></span>
              `).join('')}
              ${Object.values(acc.currencies || {}).every(v => v === 0) ? '<span style="color:rgba(255,255,255,0.2);font-size:13px;">لا توجد أرصدة</span>' : ''}
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
              <button class="btn-ios btn-ios-success btn-ios-small" onclick="openTxModal('deposit','${acc.id}')">+ إيداع</button>
              <button class="btn-ios btn-ios-danger btn-ios-small" onclick="openTxModal('withdraw','${acc.id}')">- سحب</button>
              <button class="btn-ios btn-ios-ghost btn-ios-small" onclick="deleteAccount('${acc.id}')">🗑</button>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 10px;">
            <span style="font-weight:600;color:#fff;font-size:15px;">المعاملات</span>
            <span style="font-size:12px;color:rgba(255,255,255,0.25);">${txs.length}</span>
          </div>
      `;

      if (txs.length === 0) {
        html += `
          <div class="empty-ios glass" style="border-radius:16px;padding:30px 20px;">
            <span class="icon" style="font-size:32px;">📭</span>
            <h3 style="font-size:15px;">لا توجد معاملات</h3>
          </div>
        `;
      } else {
        txs.forEach((tx, i) => {
          html += renderTxItem(tx, i);
        });
      }

      html += `</div>`;
      return html;
    }

    // ============================================================
    // ====== TRANSACTIONS PAGE ======
    // ============================================================

    function renderTransactions() {
      let txs = [...state.transactions];

      let html = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <span style="font-size:20px;font-weight:700;color:#fff;">المعاملات</span>
          <span style="font-size:13px;color:rgba(255,255,255,0.25);">${txs.length}</span>
        </div>
      `;

      if (txs.length === 0) {
        html += `
          <div class="empty-ios glass" style="border-radius:20px;padding:40px 20px;">
            <span class="icon">📭</span>
            <h3>لا توجد معاملات</h3>
            <p>أضف معاملة جديدة</p>
          </div>
        `;
      } else {
        txs.forEach((tx, i) => {
          html += renderTxItem(tx, i);
        });
      }

      return html;
    }

    // ============================================================
    // ====== TRANSACTION ITEM ======
    // ============================================================

    function renderTxItem(tx, index) {
      const isDeposit = tx.type === 'deposit';
      const isWithdraw = tx.type === 'withdraw';
      const isTransfer = tx.type === 'transfer';
      const info = curInfo(tx.currency);
      const reason = reasonInfo(tx.reason);
      const acc = getAccount(tx.accountId);
      const toAcc = tx.toAccountId ? getAccount(tx.toAccountId) : null;
      const icon = isDeposit ? '📥' : isWithdraw ? '📤' : '🔄';
      const cls = isDeposit ? 'deposit' : isWithdraw ? 'withdraw' : 'transfer';
      const sign = isWithdraw ? '-' : '+';
      const clsAmt = isDeposit ? 'pos' : isWithdraw ? 'neg' : 'neu';

      let amountDisplay = `${sign}${info?.symbol || ''}${formatNum(tx.amount)}`;
      if (isTransfer && tx.convertedAmount) {
        const tInfo = curInfo(tx.targetCurrency || 'USD');
        amountDisplay += ` → ${tInfo?.symbol || ''}${formatNum(tx.convertedAmount)}`;
      }

      return `
        <div class="tx-ios animate-fade-up" style="animation-delay:${index * 0.03}s">
          <div class="icon ${cls}">${icon}</div>
          <div class="info">
            <div class="title">${reason?.icon || ''} ${reason?.label || tx.reason}</div>
            <div class="sub">${acc?.name || ''} ${toAcc ? `→ ${toAcc.name}` : ''} · ${formatDate(tx.date)}</div>
          </div>
          <div class="amount ${clsAmt}" style="font-size:13px;">${amountDisplay}</div>
          <button class="del" onclick="deleteTransaction('${tx.id}')">✕</button>
        </div>
      `;
    }

    // ============================================================
    // ====== REPORTS ======
    // ============================================================

    function renderReports() {
      const income = state.transactions.filter(t => t.type === 'deposit').reduce((s, t) => s + t.amount, 0);
      const expense = state.transactions.filter(t => t.type === 'withdraw').reduce((s, t) => s + t.amount, 0);
      const net = income - expense;

      const byReason = {};
      state.transactions.filter(t => t.type === 'withdraw').forEach(t => {
        if (!byReason[t.reason]) byReason[t.reason] = 0;
        byReason[t.reason] += t.amount;
      });
      const sorted = Object.entries(byReason).sort((a, b) => b[1] - a[1]);
      const maxAmt = sorted[0]?.[1] || 1;

      let html = `
        <div style="margin-bottom:16px;">
          <span style="font-size:20px;font-weight:700;color:#fff;">التقارير</span>
        </div>

        <div class="stats-ios">
          <div class="stat-ios" style="border-color:rgba(52,199,89,0.1);">
            <div class="value" style="color:var(--success);">${formatNum(income)}</div>
            <div class="label">إيداعات</div>
          </div>
          <div class="stat-ios" style="border-color:rgba(255,59,48,0.1);">
            <div class="value" style="color:var(--danger);">${formatNum(expense)}</div>
            <div class="label">سحوبات</div>
          </div>
          <div class="stat-ios" style="border-color:${net >= 0 ? 'rgba(52,199,89,0.1)' : 'rgba(255,59,48,0.1)'};">
            <div class="value" style="color:${net >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatNum(net)}</div>
            <div class="label">صافي</div>
          </div>
        </div>
      `;

      if (sorted.length > 0) {
        html += `
          <div class="glass" style="padding:18px 20px;border-radius:18px;margin-bottom:16px;">
            <div style="font-weight:600;color:#fff;font-size:15px;margin-bottom:12px;">التوزيع حسب السبب</div>
            ${sorted.map(([r, amt]) => {
              const info = reasonInfo(r);
              const pct = (amt / maxAmt) * 100;
              return `
                <div style="margin-bottom:10px;">
                  <div style="display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:3px;">
                    <span>${info?.icon || ''} ${info?.label || r}</span>
                    <span style="color:#fff;">${formatNum(amt)}</span>
                  </div>
                  <div style="height:4px;border-radius:10px;background:rgba(255,255,255,0.04);overflow:hidden;">
                    <div style="height:100%;border-radius:10px;background:linear-gradient(90deg,var(--primary),var(--secondary));width:${Math.min(pct, 100)}%;"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        html += `
          <div class="empty-ios glass" style="border-radius:18px;padding:30px 20px;">
            <span class="icon" style="font-size:32px;">📊</span>
            <h3 style="font-size:15px;">لا توجد بيانات</h3>
            <p style="font-size:13px;">أضف معاملات لعرض التقارير</p>
          </div>
        `;
      }

      html += `
        <button class="btn-ios btn-ios-primary w-full" onclick="exportData()">📤 تصدير التقرير</button>
      `;

      return html;
    }

    // ============================================================
    // ====== MODALS ======
    // ============================================================

    function renderModals() {
      $$('.modal-ios').forEach(el => el.remove());
      if (modals.createAccount) renderCreateAccountModal();
      if (modals.addTransaction) renderAddTransactionModal();
      if (modals.transfer) renderTransferModal();
      if (modals.settings) renderSettingsModal();
    }

    // ----- CREATE ACCOUNT -----
    function renderCreateAccountModal() {
      const s = { currencies: [], icon: 0, color: 0, balances: {} };
      const overlay = document.createElement('div');
      overlay.className = 'modal-ios';
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="head">
            <h2>✨ حساب جديد</h2>
            <button class="close" onclick="closeModal('createAccount')">✕</button>
          </div>
          <div>
            <input class="input-ios" id="acc-name" placeholder="اسم الحساب" style="margin-bottom:12px;">
            <div style="font-size:13px;color:rgba(255,255,255,0.3);margin-bottom:8px;">العملات</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;">
              ${CURRENCIES.map(c => `
                <button class="btn-ios btn-ios-ghost btn-ios-small" style="text-align:center;${s.currencies.includes(c.value) ? 'border-color:var(--primary);background:rgba(0,122,255,0.12);' : ''}" data-cur="${c.value}" onclick="toggleCurIOS(this,'${c.value}')">
                  ${c.flag}<br><span style="font-size:10px;">${c.symbol}</span>
                </button>
              `).join('')}
            </div>
            <div id="acc-balances-ios" style="${s.currencies.length === 0 ? 'display:none;' : ''}margin-bottom:12px;">
              ${s.currencies.map(c => {
                const info = curInfo(c);
                return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                  <span style="font-size:16px;">${info?.flag}</span>
                  <input class="input-ios" id="bal-${c}" placeholder="${info?.symbol}0.00" type="number" style="flex:1;padding:10px 14px;font-size:14px;">
                </div>`;
              }).join('')}
            </div>
            <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px;">
              ${ACCOUNT_ICONS.map((ic, i) => `
                <button class="btn-ios btn-ios-ghost btn-ios-small" style="font-size:18px;padding:8px;${s.icon === i ? 'border-color:var(--primary);background:rgba(0,122,255,0.12);' : ''}" data-icon="${i}" onclick="selectIconIOS(this,${i})">${ic}</button>
              `).join('')}
            </div>
            <div style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;">
              ${ACCOUNT_COLORS.map((col, i) => `
                <button style="width:28px;height:28px;border-radius:50%;border:2px solid ${s.color === i ? '#fff' : 'transparent'};background:${col};cursor:pointer;" onclick="selectColorIOS(${i})" data-color="${i}"></button>
              `).join('')}
            </div>
            <button class="btn-ios btn-ios-primary w-full" onclick="submitCreateIOS()">إنشاء</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      window._createIOS = s;
    }

    window.toggleCurIOS = function(el, cur) {
      const s = window._createIOS;
      const idx = s.currencies.indexOf(cur);
      if (idx > -1) s.currencies.splice(idx, 1);
      else s.currencies.push(cur);
      $$('[data-cur]').forEach(b => {
        const v = b.dataset.cur;
        b.style.borderColor = s.currencies.includes(v) ? 'var(--primary)' : 'rgba(255,255,255,0.06)';
        b.style.background = s.currencies.includes(v) ? 'rgba(0,122,255,0.12)' : 'rgba(255,255,255,0.04)';
      });
      const cont = $('#acc-balances-ios');
      if (s.currencies.length > 0) {
        cont.style.display = 'block';
        cont.innerHTML = s.currencies.map(c => {
          const info = curInfo(c);
          return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-size:16px;">${info?.flag}</span>
            <input class="input-ios" id="bal-${c}" placeholder="${info?.symbol}0.00" type="number" style="flex:1;padding:10px 14px;font-size:14px;">
          </div>`;
        }).join('');
      } else {
        cont.style.display = 'none';
      }
    };

    window.selectIconIOS = function(el, i) {
      const s = window._createIOS;
      s.icon = i;
      $$('[data-icon]').forEach(b => {
        const v = parseInt(b.dataset.icon);
        b.style.borderColor = v === i ? 'var(--primary)' : 'rgba(255,255,255,0.06)';
        b.style.background = v === i ? 'rgba(0,122,255,0.12)' : 'rgba(255,255,255,0.04)';
      });
    };

    window.selectColorIOS = function(i) {
      const s = window._createIOS;
      s.color = i;
      $$('[data-color]').forEach((b, idx) => {
        b.style.borderColor = idx === i ? '#fff' : 'transparent';
      });
    };

    window.submitCreateIOS = function() {
      const s = window._createIOS;
      const name = $('#acc-name').value.trim();
      if (!name) { showToast('❌ أدخل اسم الحساب'); return; }
      if (s.currencies.length === 0) { showToast('❌ اختر عملة'); return; }
      const currencies = {};
      s.currencies.forEach(c => {
        const inp = $(`#bal-${c}`);
        currencies[c] = parseFloat(inp?.value) || 0;
      });
      addAccount({ name, currencies, icon: ACCOUNT_ICONS[s.icon], color: ACCOUNT_COLORS[s.color] });
    };

    // ----- ADD TRANSACTION (ترتيب جديد: النوع ← الحساب ← العملة ← السبب ← المبلغ) -----
    function openTxModal(type, accountId) {
      txStep = 1;
      txData = { type: type || 'deposit', accountId: accountId || '', currency: 'USD', reason: '', amount: 0, note: '',
        toAccountId: '', exchangeRate: 0 };
      openModal('addTransaction');
    }

    function renderAddTransactionModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-ios';
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="head">
            <h2>📝 معاملة جديدة</h2>
            <button class="close" onclick="closeModal('addTransaction')">✕</button>
          </div>
          <div id="tx-content-ios">${renderTxStepIOS()}</div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function renderTxStepIOS() {
      const steps = ['النوع', 'الحساب', 'العملة', 'السبب', 'المبلغ'];
      const current = txStep;
      const data = txData;

      let html = `
        <div class="step-ios">
          ${steps.map((s, i) => `<div class="dot ${i + 1 < current ? 'done' : i + 1 === current ? 'active' : ''}"></div>`).join('')}
        </div>
        <div class="step-ios label">${steps[current - 1]}</div>
        <div style="min-height:200px;">
      `;

      switch (current) {
        case 1:
          html += `
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
              <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:14px;text-align:center;${data.type === 'deposit' ? 'border-color:var(--success);background:rgba(52,199,89,0.1);' : ''}" onclick="setTxTypeIOS('deposit')">
                <div style="font-size:24px;">📥</div>
                <div style="font-weight:600;font-size:13px;">إيداع</div>
              </button>
              <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:14px;text-align:center;${data.type === 'withdraw' ? 'border-color:var(--danger);background:rgba(255,59,48,0.1);' : ''}" onclick="setTxTypeIOS('withdraw')">
                <div style="font-size:24px;">📤</div>
                <div style="font-weight:600;font-size:13px;">سحب</div>
              </button>
              <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:14px;text-align:center;${data.type === 'transfer' ? 'border-color:var(--primary);background:rgba(0,122,255,0.1);' : ''}" onclick="setTxTypeIOS('transfer')">
                <div style="font-size:24px;">🔄</div>
                <div style="font-weight:600;font-size:13px;">تحويل</div>
              </button>
            </div>
          `;
          break;
        case 2:
          html += `
            <div style="max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;">
              ${state.accounts.map(a => `
                <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:12px 16px;text-align:right;${data.accountId === a.id ? 'border-color:var(--primary);background:rgba(0,122,255,0.08);' : ''}" onclick="setTxAccountIOS('${a.id}')">
                  <div style="font-weight:600;font-size:14px;">${a.name}</div>
                  <div style="font-size:11px;color:rgba(255,255,255,0.3);">
                    ${Object.entries(a.currencies || {}).filter(([,v]) => v > 0).map(([c, v]) => `${curInfo(c)?.flag || ''} ${formatNum(v)}`).join(' · ') || 'لا توجد أرصدة'}
                  </div>
                </button>
              `).join('')}
            </div>
          `;
          break;
        case 3:
          const acc = getAccount(data.accountId);
          const avail = acc ? Object.keys(acc.currencies || {}) : [];
          html += `
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
              ${CURRENCIES.filter(c => avail.includes(c.value)).map(c => `
                <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:12px;text-align:center;${data.currency === c.value ? 'border-color:var(--primary);background:rgba(0,122,255,0.08);' : ''}" onclick="setTxCurrencyIOS('${c.value}')">
                  <div style="font-size:24px;">${c.flag}</div>
                  <div style="font-size:13px;font-weight:600;">${c.symbol}</div>
                  <div style="font-size:10px;color:rgba(255,255,255,0.2);">${formatNum(acc?.currencies?.[c.value] || 0)}</div>
                </button>
              `).join('')}
              ${avail.length === 0 ? '<div style="grid-column:span 3;text-align:center;color:rgba(255,255,255,0.2);padding:16px;font-size:13px;">لا توجد عملات</div>' : ''}
            </div>
          `;
          break;
        case 4:
          html += `
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;">
              ${REASONS.map(r => `
                <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:10px;text-align:center;${data.reason === r.value ? 'border-color:var(--primary);background:rgba(0,122,255,0.08);' : ''}" onclick="setTxReasonIOS('${r.value}')">
                  <div style="font-size:20px;">${r.icon}</div>
                  <div style="font-size:12px;font-weight:500;">${r.label}</div>
                </button>
              `).join('')}
            </div>
          `;
          break;
        case 5:
          const info = curInfo(data.currency);
          html += `
            <div style="margin-bottom:10px;">
              <label style="font-size:12px;color:rgba(255,255,255,0.3);">المبلغ (${info?.symbol || ''})</label>
              <input class="input-ios" id="tx-amount-ios" type="number" placeholder="0.00" style="font-size:18px;padding:12px 16px;">
            </div>
            ${data.type === 'transfer' ? `
              <div style="margin-bottom:10px;">
                <label style="font-size:12px;color:rgba(255,255,255,0.3);">سعر التحويل</label>
                <input class="input-ios" id="tx-rate-ios" type="number" placeholder="مثال: 32.50" style="padding:12px 16px;">
              </div>
              <div style="margin-bottom:10px;">
                <label style="font-size:12px;color:rgba(255,255,255,0.3);">الحساب المستهدف</label>
                <select class="select-ios" id="tx-to-ios" style="padding:12px 16px;">
                  <option value="">اختر حساب</option>
                  ${state.accounts.filter(a => a.id !== data.accountId).map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
                </select>
              </div>
            ` : ''}
            <div style="margin-bottom:14px;">
              <label style="font-size:12px;color:rgba(255,255,255,0.3);">ملاحظة</label>
              <input class="input-ios" id="tx-note-ios" placeholder="اختياري" style="padding:12px 16px;">
            </div>
            <button class="btn-ios btn-ios-success w-full" onclick="submitTxIOS()">✅ تأكيد</button>
          `;
          break;
      }

      html += `</div>`;

      if (current < 5 && current > 0) {
        html += `
          <div style="display:flex;gap:8px;margin-top:14px;">
            ${current > 1 ? `<button class="btn-ios btn-ios-ghost btn-ios-small" style="flex:1;" onclick="txStep--;renderTxContentIOS()">← رجوع</button>` : ''}
            <button class="btn-ios btn-ios-primary btn-ios-small" style="flex:1;" onclick="txStep++;renderTxContentIOS()">التالي →</button>
          </div>
        `;
      }

      return html;
    }

    window.renderTxContentIOS = function() {
      const container = $('#tx-content-ios');
      if (container) container.innerHTML = renderTxStepIOS();
    };

    window.setTxTypeIOS = function(type) {
      txData.type = type;
      txStep = 2;
      renderTxContentIOS();
    };

    window.setTxAccountIOS = function(id) {
      txData.accountId = id;
      const acc = getAccount(id);
      if (acc) {
        const keys = Object.keys(acc.currencies || {});
        if (keys.length > 0) txData.currency = keys[0];
      }
      if (txData.type === 'transfer') {
        txStep = 5;
        renderTxContentIOS();
        return;
      }
      txStep = 3;
      renderTxContentIOS();
    };

    window.setTxCurrencyIOS = function(cur) {
      txData.currency = cur;
      txStep = 4;
      renderTxContentIOS();
    };

    window.setTxReasonIOS = function(reason) {
      txData.reason = reason;
      txStep = 5;
      renderTxContentIOS();
    };

    window.submitTxIOS = function() {
      const data = txData;
      const amount = parseFloat($('#tx-amount-ios')?.value);
      if (!data.accountId) { showToast('❌ اختر الحساب'); return; }
      if (!data.reason && data.type !== 'transfer') { showToast('❌ اختر السبب'); return; }
      if (!amount || amount <= 0) { showToast('❌ أدخل مبلغ صحيح'); return; }

      if (data.type === 'transfer') {
        const toAcc = $('#tx-to-ios')?.value;
        const rate = parseFloat($('#tx-rate-ios')?.value);
        if (!toAcc) { showToast('❌ اختر الحساب المستهدف'); return; }
        if (!rate || rate <= 0) { showToast('❌ أدخل سعر تحويل صحيح'); return; }
        data.toAccountId = toAcc;
        data.exchangeRate = rate;
      }

      data.note = $('#tx-note-ios')?.value || '';
      data.amount = amount;

      const acc = getAccount(data.accountId);
      if (data.type === 'withdraw') {
        const bal = acc?.currencies?.[data.currency] || 0;
        if (amount > bal) { showToast(`⚠️ الرصيد غير كافٍ: ${formatNum(bal)}`); return; }
      }
      if (data.type === 'transfer') {
        const bal = acc?.currencies?.[data.currency] || 0;
        if (amount > bal) { showToast(`⚠️ الرصيد غير كافٍ: ${formatNum(bal)}`); return; }
      }

      addTransaction(data);
      closeModal('addTransaction');
      txStep = 1;
      txData = { type: 'deposit', accountId: '', currency: 'USD', reason: '', amount: 0, note: '', toAccountId: '',
        exchangeRate: 0 };
      renderAll();
    };

    // ----- TRANSFER (تحويل بين الحسابات مع سعر الصرف) -----
    function renderTransferModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-ios';
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="head">
            <h2>🔄 تحويل بين الحسابات</h2>
            <button class="close" onclick="closeModal('transfer')">✕</button>
          </div>
          <div>
            <div style="margin-bottom:10px;">
              <label style="font-size:12px;color:rgba(255,255,255,0.3);">من حساب</label>
              <select class="select-ios" id="tf-from-ios" style="padding:12px 16px;margin-top:2px;" onchange="updateTransferIOS()">
                <option value="">اختر حساب</option>
                ${state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
              </select>
            </div>
            <div style="text-align:center;font-size:20px;color:rgba(255,255,255,0.1);margin:2px 0;">⬇</div>
            <div style="margin-bottom:12px;">
              <label style="font-size:12px;color:rgba(255,255,255,0.3);">إلى حساب</label>
              <select class="select-ios" id="tf-to-ios" style="padding:12px 16px;margin-top:2px;" onchange="updateTransferIOS()">
                <option value="">اختر حساب</option>
                ${state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
              </select>
            </div>
            <div id="tf-details-ios" style="display:none;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div>
                  <label style="font-size:12px;color:rgba(255,255,255,0.3);">المبلغ</label>
                  <input class="input-ios" id="tf-amount-ios" type="number" placeholder="0.00" style="padding:12px 16px;" oninput="updateTransferIOS()">
                </div>
                <div>
                  <label style="font-size:12px;color:rgba(255,255,255,0.3);">سعر التحويل</label>
                  <input class="input-ios" id="tf-rate-ios" type="number" placeholder="32.50" style="padding:12px 16px;" oninput="updateTransferIOS()">
                  <div style="font-size:10px;color:rgba(255,255,255,0.2);margin-top:2px;">1 ${transferData.fromCurrency} = ? ${transferData.toCurrency}</div>
                </div>
              </div>
              <div id="tf-preview-ios" style="padding:14px;border-radius:14px;background:rgba(52,199,89,0.06);border:1px solid rgba(52,199,89,0.08);margin-top:10px;text-align:center;">
                <span style="font-size:12px;color:rgba(255,255,255,0.3);">معاينة التحويل</span>
                <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
                  <span id="tf-from-amt-ios" style="font-weight:700;color:#fff;">0.00</span>
                  <span style="font-size:16px;color:rgba(255,255,255,0.1);">→</span>
                  <span id="tf-to-amt-ios" style="font-weight:700;color:var(--success);">0.00</span>
                </div>
                <div style="font-size:11px;color:rgba(255,255,255,0.2);margin-top:4px;">
                  ${transferData.fromCurrency} → ${transferData.toCurrency}
                </div>
              </div>
              <button class="btn-ios btn-ios-success w-full" style="margin-top:10px;" onclick="submitTransferIOS()">✅ تأكيد التحويل</button>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    window.updateTransferIOS = function() {
      const from = $('#tf-from-ios')?.value;
      const to = $('#tf-to-ios')?.value;
      const details = $('#tf-details-ios');
      if (from && to && from !== to) {
        details.style.display = 'block';
        const fromAcc = getAccount(from);
        const toAcc = getAccount(to);
        const amount = parseFloat($('#tf-amount-ios')?.value) || 0;
        const rate = parseFloat($('#tf-rate-ios')?.value) || 0;
        const converted = amount * rate;

        const fKeys = Object.keys(fromAcc?.currencies || {});
        const tKeys = Object.keys(toAcc?.currencies || {});
        const fCur = fKeys.length > 0 ? fKeys[0] : 'USD';
        const tCur = tKeys.length > 0 ? tKeys[0] : 'USD';
        const fInfo = curInfo(fCur);
        const tInfo = curInfo(tCur);

        $('#tf-from-amt-ios').textContent = `${fInfo?.symbol || ''}${formatNum(amount)}`;
        $('#tf-to-amt-ios').textContent = `${tInfo?.symbol || ''}${formatNum(converted)}`;

        transferData.fromAccountId = from;
        transferData.toAccountId = to;
        transferData.fromCurrency = fCur;
        transferData.toCurrency = tCur;
        transferData.amount = amount;
        transferData.exchangeRate = rate;
        transferData.convertedAmount = converted;

        const rateLabel = document.querySelector('#tf-rate-ios + div');
        if (rateLabel) {
          rateLabel.textContent = `1 ${fCur} = ${rate} ${tCur}`;
        }
      } else {
        details.style.display = 'none';
      }
    };

    window.submitTransferIOS = function() {
      const data = transferData;
      if (!data.fromAccountId || !data.toAccountId) { showToast('❌ اختر الحسابات'); return; }
      if (data.fromAccountId === data.toAccountId) { showToast('❌ لا يمكن التحويل لنفس الحساب'); return; }
      if (!data.amount || data.amount <= 0) { showToast('❌ أدخل مبلغ'); return; }
      if (!data.exchangeRate || data.exchangeRate <= 0) { showToast('❌ أدخل سعر تحويل'); return; }

      const fromAcc = getAccount(data.fromAccountId);
      const bal = fromAcc?.currencies?.[data.fromCurrency] || 0;
      if (data.amount > bal) { showToast(`⚠️ الرصيد غير كافٍ: ${formatNum(bal)}`); return; }

      addTransaction({
        type: 'transfer',
        accountId: data.fromAccountId,
        toAccountId: data.toAccountId,
        currency: data.fromCurrency,
        amount: data.amount,
        exchangeRate: data.exchangeRate,
        reason: 'other',
        note: `تحويل من ${fromAcc?.name || ''}`,
      });

      closeModal('transfer');
      transferData = { fromAccountId: '', toAccountId: '', fromCurrency: 'USD', toCurrency: 'TRY', amount: 0,
        exchangeRate: 0, convertedAmount: 0 };
      renderAll();
    };

    // ----- SETTINGS -----
    function renderSettingsModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-ios';
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="head">
            <h2>⚙️ الإعدادات</h2>
            <button class="close" onclick="closeModal('settings')">✕</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:right;width:100%;" onclick="closeModal('settings');exportData();">
              <span style="font-size:20px;">📤</span>
              <div><div style="font-weight:600;font-size:14px;">تصدير البيانات</div><div style="font-size:11px;color:rgba(255,255,255,0.2);">نسخة احتياطية</div></div>
            </button>
            <button class="btn-ios btn-ios-ghost btn-ios-small" style="padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:right;width:100%;" onclick="closeModal('settings');triggerImport();">
              <span style="font-size:20px;">📥</span>
              <div><div style="font-weight:600;font-size:14px;">استيراد البيانات</div><div style="font-size:11px;color:rgba(255,255,255,0.2);">استعادة</div></div>
            </button>
            <div style="padding:12px;border-radius:14px;background:rgba(255,255,255,0.02);text-align:center;font-size:12px;color:rgba(255,255,255,0.15);">
              ${state.accounts.length} حسابات · ${state.transactions.length} معاملات
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    // ============================================================
    // ====== NAVIGATION ======
    // ============================================================

    window.switchTab = function(tab) {
      currentTab = tab;
      selectedAccountId = null;
      renderAll();
    };

    window.selectAccount = function(id) {
      selectedAccountId = id;
      renderAll();
    };

    // ============================================================
    // ====== INIT ======
    // ============================================================

    loadData();
    renderAll();

    console.log('💰 تطبيق حساباتي - النسخة الكلاسيكية المطورة');
    console.log(`📊 ${state.accounts.length} حسابات، ${state.transactions.length} معاملات`);
    console.log('📌 الأسباب المتاحة:', REASONS.map(r => r.label).join(', '));

    // إظهار الأزرار بعد تحميل البيانات
    updateFabs();
  </script>

</body>
</html>
