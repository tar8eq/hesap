    .fade-up { animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1) both; }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="app" id="app"></div>

  <nav class="navbar" id="navbar"></nav>

  <script>
    // ============================================================
    // البيانات
    // ============================================================
    const CURRENCIES = [
      { value: 'USD', label: 'دولار', symbol: '$', flag: '🇺🇸' },
      { value: 'TRY', label: 'ليرة', symbol: '₺', flag: '🇹🇷' },
      { value: 'EUR', label: 'يورو', symbol: '€', flag: '🇪🇺' },
    ];

    const REASONS = [
      { value: 'rent', label: 'إيجار', icon: '🏠' },
      { value: 'internet', label: 'إنترنت', icon: '🌐' },
      { value: 'electricity', label: 'كهرباء', icon: '⚡' },
      { value: 'gas', label: 'غاز', icon: '🔥' },
      { value: 'personal', label: 'شخصي', icon: '👤' },
      { value: 'apartment', label: 'الشقة', icon: '🏢' },
      { value: 'metro', label: 'مترو', icon: '🚇' },
      { value: 'salary', label: 'راتب', icon: '💼' },
      { value: 'other', label: 'أخرى', icon: '📌' },
    ];

    const ACCOUNT_COLORS = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#a855f7', '#ec4899', '#14b8a6'];
    const ACCOUNT_ICONS = ['👛', '🐷', '🏢', '🏛️', '🪙', '💵', '💳', '💰'];

    const STORAGE_KEY = 'tarek_finance_v3';

    let state = { accounts: [], transactions: [] };
    let currentTab = 'home';
    let selectedAccountId = null;
    let modals = {
      createAccount: false,
      addTransaction: false,
      transfer: false,
      settings: false,
      editTransaction: false,
      editAccount: false,
    };
    let txStep = 1;
    let txData = { type: 'deposit', accountId: '', currency: 'USD', reason: '', amount: 0, note: '', toAccountId: '', exchangeRate: 0 };
    let transferData = { fromAccountId: '', toAccountId: '', fromCurrency: 'USD', toCurrency: 'USD', amount: 0, exchangeRate: 0, convertedAmount: 0 };
    let editingTxId = null;
    let editingAccountId = null;

    const $ = (s, c = document) => c.querySelector(s);
    const $$ = (s, c = document) => [...c.querySelectorAll(s)];
    const uid = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
    const getAccount = (id) => state.accounts.find(a => a.id === id);
    const getTransaction = (id) => state.transactions.find(t => t.id === id);
    const getTransactions = (accountId) => state.transactions.filter(t => t.accountId === accountId || t.toAccountId === accountId);
    const curInfo = (c) => CURRENCIES.find(x => x.value === c);
    const reasonInfo = (r) => REASONS.find(x => x.value === r);
    const fmt = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtDate = (d) => new Date(d).toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });

    function getTotalBalance() {
      const t = { USD: 0, TRY: 0, EUR: 0 };
      state.accounts.forEach(a => {
        Object.entries(a.currencies || {}).forEach(([c, v]) => {
          if (t[c] !== undefined) t[c] += v;
        });
      });
      return t;
    }

    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.error(e); }
    }

    function loadData() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
          const d = JSON.parse(s);
          state.accounts = d.accounts || [];
          state.transactions = d.transactions || [];
        }
      } catch (e) { console.error(e); }
    }

    function showToast(msg, type = 'success') {
      const old = $('#toast');
      if (old) old.remove();
      const el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast ' + type;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'all 0.4s';
        el.style.opacity = '0';
        el.style.transform = 'translate(-50%, -20px)';
        setTimeout(() => el.remove(), 400);
      }, 2000);
    }

    function openModal(id) {
      modals[id] = true;
      document.body.style.overflow = 'hidden';
      renderAll();
    }
    function closeModal(id) {
      modals[id] = false;
      document.body.style.overflow = '';
      renderAll();
    }

    // ============================================================
    // عمليات الحسابات
    // ============================================================
    function addAccount(data) {
      const acc = {
        id: uid(),
        name: data.name.trim(),
        currencies: data.currencies || {},
        color: data.color || ACCOUNT_COLORS[0],
        icon: data.icon || ACCOUNT_ICONS[0],
        createdAt: new Date().toISOString(),
      };
      state.accounts.push(acc);
      saveData();
      closeModal('createAccount');
      showToast('✅ تم إنشاء الحساب بنجاح');
      renderAll();
    }

    function updateAccount(id, data) {
      const acc = getAccount(id);
      if (!acc) return;
      acc.name = data.name.trim() || acc.name;
      if (data.currencies) {
        Object.keys(data.currencies).forEach(c => {
          acc.currencies[c] = data.currencies[c];
        });
      }
      if (data.icon) acc.icon = data.icon;
      if (data.color) acc.color = data.color;
      saveData();
      closeModal('editAccount');
      showToast('✅ تم تحديث الحساب');
      renderAll();
    }

    function deleteAccount(id) {
      if (!confirm('🗑️ حذف الحساب؟ سيتم حذف جميع المعاملات المرتبطة به')) return;
      state.transactions = state.transactions.filter(t => t.accountId !== id && t.toAccountId !== id);
      state.accounts = state.accounts.filter(a => a.id !== id);
      saveData();
      if (selectedAccountId === id) selectedAccountId = null;
      showToast('🗑️ تم حذف الحساب', 'warn');
      renderAll();
    }

    // ============================================================
    // عمليات المعاملات
    // ============================================================
    function addTransaction(data) {
      const tx = {
        id: uid(),
        type: data.type,
        accountId: data.accountId,
        currency: data.currency,
        amount: data.amount,
        reason: data.reason,
        note: data.note || '',
        date: new Date().toISOString(),
        toAccountId: data.toAccountId || null,
        exchangeRate: data.exchangeRate || null,
        convertedAmount: null,
        targetCurrency: null,
      };

      let accs = [...state.accounts];

      if (data.type === 'deposit') {
        accs = accs.map(a => a.id === data.accountId ? {
          ...a,
          currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) + data.amount }
        } : a);
      } else if (data.type === 'withdraw') {
        accs = accs.map(a => a.id === data.accountId ? {
          ...a,
          currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) - data.amount }
        } : a);
      } else if (data.type === 'transfer' && data.toAccountId) {
        if (data.exchangeRate && data.exchangeRate > 0 && data.currency !== data.toCurrency) {
          const converted = data.amount * data.exchangeRate;
          tx.convertedAmount = converted;
          tx.targetCurrency = data.toCurrency || 'USD';
          accs = accs.map(a => {
            if (a.id === data.accountId) {
              return { ...a, currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) - data.amount } };
            }
            if (a.id === data.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [data.toCurrency]: (a.currencies[data.toCurrency] || 0) + converted } };
            }
            return a;
          });
        } else {
          accs = accs.map(a => {
            if (a.id === data.accountId) {
              return { ...a, currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) - data.amount } };
            }
            if (a.id === data.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [data.currency]: (a.currencies[data.currency] || 0) + data.amount } };
            }
            return a;
          });
        }
      }

      state.accounts = accs;
      state.transactions = [tx, ...state.transactions];
      saveData();
      showToast('✅ تمت المعاملة بنجاح');
      renderAll();
    }

    function updateTransaction(id, data) {
      const oldTx = getTransaction(id);
      if (!oldTx) return;

      let accs = [...state.accounts];

      if (oldTx.type === 'deposit') {
        accs = accs.map(a => a.id === oldTx.accountId ? {
          ...a,
          currencies: { ...a.currencies, [oldTx.currency]: (a.currencies[oldTx.currency] || 0) - oldTx.amount }
        } : a);
      } else if (oldTx.type === 'withdraw') {
        accs = accs.map(a => a.id === oldTx.accountId ? {
          ...a,
          currencies: { ...a.currencies, [oldTx.currency]: (a.currencies[oldTx.currency] || 0) + oldTx.amount }
        } : a);
      } else if (oldTx.type === 'transfer' && oldTx.toAccountId) {
        if (oldTx.exchangeRate && oldTx.exchangeRate > 0 && oldTx.convertedAmount) {
          accs = accs.map(a => {
            if (a.id === oldTx.accountId) {
              return { ...a, currencies: { ...a.currencies, [oldTx.currency]: (a.currencies[oldTx.currency] || 0) + oldTx.amount } };
            }
            if (a.id === oldTx.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [oldTx.targetCurrency || 'USD']: (a.currencies[oldTx.targetCurrency || 'USD'] || 0) - oldTx.convertedAmount } };
            }
            return a;
          });
        } else {
          accs = accs.map(a => {
            if (a.id === oldTx.accountId) {
              return { ...a, currencies: { ...a.currencies, [oldTx.currency]: (a.currencies[oldTx.currency] || 0) + oldTx.amount } };
            }
            if (a.id === oldTx.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [oldTx.currency]: (a.currencies[oldTx.currency] || 0) - oldTx.amount } };
            }
            return a;
          });
        }
      }

      const newTx = { ...oldTx, ...data };
      if (newTx.type === 'deposit') {
        accs = accs.map(a => a.id === newTx.accountId ? {
          ...a,
          currencies: { ...a.currencies, [newTx.currency]: (a.currencies[newTx.currency] || 0) + newTx.amount }
        } : a);
      } else if (newTx.type === 'withdraw') {
        accs = accs.map(a => a.id === newTx.accountId ? {
          ...a,
          currencies: { ...a.currencies, [newTx.currency]: (a.currencies[newTx.currency] || 0) - newTx.amount }
        } : a);
      } else if (newTx.type === 'transfer' && newTx.toAccountId) {
        if (newTx.exchangeRate && newTx.exchangeRate > 0 && newTx.currency !== newTx.toCurrency) {
          const converted = newTx.amount * newTx.exchangeRate;
          newTx.convertedAmount = converted;
          newTx.targetCurrency = newTx.toCurrency || 'USD';
          accs = accs.map(a => {
            if (a.id === newTx.accountId) {
              return { ...a, currencies: { ...a.currencies, [newTx.currency]: (a.currencies[newTx.currency] || 0) - newTx.amount } };
            }
            if (a.id === newTx.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [newTx.toCurrency]: (a.currencies[newTx.toCurrency] || 0) + converted } };
            }
            return a;
          });
        } else {
          accs = accs.map(a => {
            if (a.id === newTx.accountId) {
              return { ...a, currencies: { ...a.currencies, [newTx.currency]: (a.currencies[newTx.currency] || 0) - newTx.amount } };
            }
            if (a.id === newTx.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [newTx.currency]: (a.currencies[newTx.currency] || 0) + newTx.amount } };
            }
            return a;
          });
        }
      }

      state.accounts = accs;
      state.transactions = state.transactions.map(t => t.id === id ? newTx : t);
      saveData();
      closeModal('editTransaction');
      showToast('✅ تم تعديل المعاملة');
      renderAll();
    }

    function deleteTransaction(id) {
      if (!confirm('🗑️ هل أنت متأكد من حذف هذه المعاملة؟')) return;
      const tx = getTransaction(id);
      if (!tx) return;

      let accs = [...state.accounts];

      if (tx.type === 'deposit') {
        accs = accs.map(a => a.id === tx.accountId ? {
          ...a,
          currencies: { ...a.currencies, [tx.currency]: (a.currencies[tx.currency] || 0) - tx.amount }
        } : a);
      } else if (tx.type === 'withdraw') {
        accs = accs.map(a => a.id === tx.accountId ? {
          ...a,
          currencies: { ...a.currencies, [tx.currency]: (a.currencies[tx.currency] || 0) + tx.amount }
        } : a);
      } else if (tx.type === 'transfer' && tx.toAccountId) {
        if (tx.exchangeRate && tx.exchangeRate > 0 && tx.convertedAmount) {
          accs = accs.map(a => {
            if (a.id === tx.accountId) {
              return { ...a, currencies: { ...a.currencies, [tx.currency]: (a.currencies[tx.currency] || 0) + tx.amount } };
            }
            if (a.id === tx.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [tx.targetCurrency || 'USD']: (a.currencies[tx.targetCurrency || 'USD'] || 0) - tx.convertedAmount } };
            }
            return a;
          });
        } else {
          accs = accs.map(a => {
            if (a.id === tx.accountId) {
              return { ...a, currencies: { ...a.currencies, [tx.currency]: (a.currencies[tx.currency] || 0) + tx.amount } };
            }
            if (a.id === tx.toAccountId) {
              return { ...a, currencies: { ...a.currencies, [tx.currency]: (a.currencies[tx.currency] || 0) - tx.amount } };
            }
            return a;
          });
        }
      }

      state.accounts = accs;
      state.transactions = state.transactions.filter(t => t.id !== id);
      saveData();
      showToast('🗑️ تم حذف المعاملة', 'warn');
      renderAll();
    }

    // ============================================================
    // تصدير/استيراد
    // ============================================================
    function exportData() {
      const data = { accounts: state.accounts, transactions: state.transactions, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tarek_backup_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('📤 تم تصدير البيانات');
    }

    function importData(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const d = JSON.parse(e.target.result);
          if (d.accounts && d.transactions) {
            state.accounts = d.accounts;
            state.transactions = d.transactions;
            saveData();
            renderAll();
            showToast(`✅ تم استيراد ${d.accounts.length} حسابات`);
          } else {
            showToast('❌ ملف غير صالح', 'error');
          }
        } catch (err) {
          showToast('❌ خطأ في الاستيراد', 'error');
        }
      };
      reader.readAsText(file);
    }

    function triggerImport() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = function() {
        if (this.files && this.files[0]) importData(this.files[0]);
      };
      input.click();
    }

    // ============================================================
    // Render
    // ============================================================
    function renderAll() {
      renderApp();
      renderNav();
      renderModals();
    }

    // ============================================================
    // شريط التنقل السفلي - 5 أزرار ثابتة
    // [الرئيسية] [المعاملات] [+] [⇄] [التقارير]
    // ============================================================
    function renderNav() {
      const nav = $('#navbar');
      if (!nav) return;

      nav.innerHTML = `
        <button class="nav-item ${currentTab === 'home' && !selectedAccountId ? 'active' : ''}" onclick="switchTab('home')">
          <span class="nav-ico">🏠</span>
          <span>الرئيسية</span>
        </button>
        <button class="nav-item ${currentTab === 'transactions' && !selectedAccountId ? 'active' : ''}" onclick="switchTab('transactions')">
          <span class="nav-ico">📋</span>
          <span>المعاملات</span>
        </button>
        <button class="nav-fab add" onclick="openModal('addTransaction')" title="معاملة جديدة">+</button>
        <button class="nav-fab trf" onclick="openModal('transfer')" title="تحويل">⇄</button>
        <button class="nav-item ${currentTab === 'reports' && !selectedAccountId ? 'active' : ''}" onclick="switchTab('reports')">
          <span class="nav-ico">📊</span>
          <span>التقارير</span>
        </button>
      `;
    }

    function renderApp() {
      const app = $('#app');
      if (!app) return;

      let html = '';

      if (selectedAccountId) {
        const acc = getAccount(selectedAccountId);
        html += `
          <div class="topbar">
            <div class="brand">
              <button class="icon-btn" onclick="selectedAccountId=null;renderAll()">←</button>
              <div>
                <div class="brand-name" style="font-size:18px;">${acc?.name || 'حساب'}</div>
                <div class="brand-sub">تفاصيل الحساب</div>
              </div>
            </div>
            <div class="flex gap-2">
              <button class="icon-btn" onclick="openEditAccount('${selectedAccountId}')">✎</button>
              <button class="icon-btn" onclick="deleteAccount('${selectedAccountId}')" style="color:var(--danger);">🗑</button>
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="topbar">
            <div class="brand">
              <div class="brand-mark">T</div>
              <div>
                <div class="brand-name">TAREK</div>
                <div class="brand-sub">إدارة مالية احترافية</div>
              </div>
            </div>
            <button class="icon-btn" onclick="openModal('settings')">⚙</button>
          </div>
        `;
      }

      if (selectedAccountId) {
        html += renderAccountDetail();
      } else {
        switch (currentTab) {
          case 'home': html += renderHome(); break;
          case 'transactions': html += renderTransactions(); break;
          case 'reports': html += renderReports(); break;
        }
      }

      app.innerHTML = html;
    }

    function renderHome() {
      const totals = getTotalBalance();
      const hasBal = totals.USD !== 0 || totals.TRY !== 0 || totals.EUR !== 0;
      const totalCurrencies = Object.values(totals).filter(v => v !== 0).length;

      let html = '';

      html += `
        <div class="hero fade-up">
          <div class="hero-content">
            <div class="hero-label">الرصيد الإجمالي</div>
            ${hasBal ? `
              <div class="hero-amounts">
                ${CURRENCIES.filter(c => totals[c.value] !== 0).map(c => `
                  <div class="hero-amt">
                    <span class="cur">${c.flag} ${c.label}</span>
                    <span class="val ${totals[c.value] < 0 ? 'neg' : ''}">${c.symbol}${fmt(totals[c.value])}</span>
                  </div>
                `).join('')}
              </div>
            ` : `
              <div class="hero-amounts">
                <div class="hero-amt">
                  <span class="cur">لا توجد أرصدة</span>
                  <span class="val">0.00</span>
                </div>
              </div>
            `}
            <div class="hero-chips">
              <span class="hero-chip">👥 ${state.accounts.length} حساب</span>
              <span class="hero-chip">💱 ${totalCurrencies} عملة</span>
              <span class="hero-chip">📋 ${state.transactions.length} معاملة</span>
            </div>
          </div>
        </div>
      `;

      const income = state.transactions.filter(t => t.type === 'deposit').reduce((s, t) => s + t.amount, 0);
      const expense = state.transactions.filter(t => t.type === 'withdraw').reduce((s, t) => s + t.amount, 0);
      const net = income - expense;

      html += `
        <div class="stats">
          <div class="stat income">
            <div class="num">${fmt(income)}</div>
            <div class="lbl">إيداعات</div>
          </div>
          <div class="stat expense">
            <div class="num">${fmt(expense)}</div>
            <div class="lbl">سحوبات</div>
          </div>
          <div class="stat net">
            <div class="num">${fmt(net)}</div>
            <div class="lbl">صافي</div>
          </div>
        </div>
      `;

      html += `
        <button class="btn btn-primary btn-block btn-lg mb-4" onclick="openModal('createAccount')">
          <span style="font-size:20px;">+</span> إضافة حساب جديد
        </button>
      `;

      html += `
        <div class="section-head">
          <div class="section-title">حساباتي</div>
          <span class="section-count">${state.accounts.length}</span>
        </div>
      `;

      if (state.accounts.length === 0) {
        html += `
          <div class="empty">
            <span class="empty-ico">👛</span>
            <h3>لا توجد حسابات بعد</h3>
            <p>أضف حسابك الأول لتبدأ</p>
          </div>
        `;
      } else {
        state.accounts.forEach((acc, i) => {
          const icon = acc.icon || ACCOUNT_ICONS[i % ACCOUNT_ICONS.length];
          const color = acc.color || ACCOUNT_COLORS[i % ACCOUNT_COLORS.length];
          const currencies = Object.entries(acc.currencies || {}).filter(([, v]) => v !== 0);
          html += `
            <div class="account-card fade-up" style="animation-delay:${i * 0.04}s;" onclick="selectAccount('${acc.id}')">
              <div style="position:absolute;right:0;top:0;bottom:0;width:4px;background:${color};"></div>
              <div class="account-icon" style="background:${color}18;color:${color};">${icon}</div>
              <div class="account-info">
                <div class="account-name">${acc.name}</div>
                <div class="account-bals">
                  ${currencies.length > 0 ? currencies.map(([c, v]) => {
                    const info = curInfo(c);
                    return `<span class="bal-item ${v < 0 ? 'neg' : ''}">${info?.flag || ''} ${info?.symbol || ''}${fmt(v)}</span>`;
                  }).join('') : '<span class="bal-item zero">لا توجد أرصدة</span>'}
                </div>
              </div>
              <div style="color:var(--muted);font-size:18px;">›</div>
            </div>
          `;
        });
      }

      return html;
    }

    function renderAccountDetail() {
      const acc = getAccount(selectedAccountId);
      if (!acc) { selectedAccountId = null; return ''; }
      const icon = acc.icon || '👛';
      const color = acc.color || '#6366f1';
      const txs = getTransactions(acc.id);

      let html = '';

      html += `
        <div class="hero fade-up" style="background:linear-gradient(135deg, ${color} 0%, ${color}cc 100%);">
          <div class="hero-content">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
              <div style="width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:26px;">${icon}</div>
              <div>
                <div style="font-size:18px;font-weight:800;">${acc.name}</div>
                <div style="font-size:11px;opacity:0.7;margin-top:2px;">${txs.length} معاملة</div>
              </div>
            </div>
            <div class="hero-amounts">
              ${CURRENCIES.filter(c => (acc.currencies?.[c.value] || 0) !== 0).map(c => {
                const v = acc.currencies?.[c.value] || 0;
                return `
                  <div class="hero-amt">
                    <span class="cur">${c.flag} ${c.label}</span>
                    <span class="val ${v < 0 ? 'neg' : ''}">${c.symbol}${fmt(v)}</span>
                  </div>
                `;
              }).join('') || '<div class="hero-amt"><span class="cur">لا توجد أرصدة</span><span class="val">0.00</span></div>'}
            </div>
            <div class="flex gap-2" style="margin-top:16px;">
              <button class="btn btn-success btn-sm" style="flex:1;" onclick="openTxModal('deposit','${acc.id}')">+ إيداع</button>
              <button class="btn btn-danger btn-sm" style="flex:1;" onclick="openTxModal('withdraw','${acc.id}')">- سحب</button>
            </div>
          </div>
        </div>
      `;

      html += `
        <div class="section-head">
          <div class="section-title">المعاملات</div>
          <span class="section-count">${txs.length}</span>
        </div>
      `;

      if (txs.length === 0) {
        html += `
          <div class="empty">
            <span class="empty-ico">📭</span>
            <h3>لا توجد معاملات</h3>
            <p>أضف أول معاملة لهذا الحساب</p>
          </div>
        `;
      } else {
        txs.forEach((tx, i) => { html += renderTxItem(tx, i); });
      }

      return html;
    }

    function renderTransactions() {
      const txs = [...state.transactions];
      let html = `
        <div class="section-head" style="margin-top:0;">
          <div class="section-title">جميع المعاملات</div>
          <span class="section-count">${txs.length}</span>
        </div>
      `;

      if (txs.length === 0) {
        html += `
          <div class="empty">
            <span class="empty-ico">📭</span>
            <h3>لا توجد معاملات</h3>
            <p>أضف معاملة جديدة للبدء</p>
          </div>
        `;
      } else {
        txs.forEach((tx, i) => { html += renderTxItem(tx, i); });
      }

      return html;
    }

    function renderTxItem(tx, index) {
      const isDeposit = tx.type === 'deposit';
      const isWithdraw = tx.type === 'withdraw';
      const isTransfer = tx.type === 'transfer';
      const info = curInfo(tx.currency);
      const reason = reasonInfo(tx.reason);
      const acc = getAccount(tx.accountId);
      const toAcc = tx.toAccountId ? getAccount(tx.toAccountId) : null;
      const icon = isDeposit ? '📥' : isWithdraw ? '📤' : '🔄';
      const cls = isDeposit ? 'dep' : isWithdraw ? 'wit' : 'trf';
      const sign = isWithdraw ? '-' : '+';
      const clsAmt = isDeposit ? 'pos' : isWithdraw ? 'neg' : 'neu';

      let amountDisplay = `${sign}${info?.symbol || ''}${fmt(tx.amount)}`;
      if (isTransfer && tx.convertedAmount) {
        const tInfo = curInfo(tx.targetCurrency || 'USD');
        amountDisplay = `${info?.symbol || ''}${fmt(tx.amount)} → ${tInfo?.symbol || ''}${fmt(tx.convertedAmount)}`;
      }

      return `
        <div class="tx-card fade-up" style="animation-delay:${index * 0.03}s;">
          <div class="tx-icon ${cls}">${icon}</div>
          <div class="tx-info">
            <div class="tx-title">${reason?.icon || ''} ${reason?.label || tx.reason || 'تحويل'}</div>
            <div class="tx-sub">${acc?.name || ''}${toAcc ? ` → ${toAcc.name}` : ''} · ${fmtDate(tx.date)}</div>
          </div>
          <div class="tx-amt ${clsAmt}">${amountDisplay}</div>
          <div class="tx-actions">
            <button class="edit" onclick="openEditTransaction('${tx.id}')" title="تعديل">✎</button>
            <button class="del" onclick="deleteTransaction('${tx.id}')" title="حذف">✕</button>
          </div>
        </div>
      `;
    }

    function renderReports() {
      const income = state.transactions.filter(t => t.type === 'deposit').reduce((s, t) => s + t.amount, 0);
      const expense = state.transactions.filter(t => t.type === 'withdraw').reduce((s, t) => s + t.amount, 0);
      const net = income - expense;

      const byReason = {};
      state.transactions.filter(t => t.type === 'withdraw').forEach(t => {
        if (!byReason[t.reason]) byReason[t.reason] = 0;
        byReason[t.reason] += t.amount;
      });
      const sorted = Object.entries(byReason).sort((a, b) => b[1] - a[1]);
      const maxAmt = sorted[0]?.[1] || 1;

      let html = `
        <div class="section-head" style="margin-top:0;">
          <div class="section-title">التقارير</div>
        </div>
        <div class="stats">
          <div class="stat income">
            <div class="num">${fmt(income)}</div>
            <div class="lbl">إيداعات</div>
          </div>
          <div class="stat expense">
            <div class="num">${fmt(expense)}</div>
            <div class="lbl">سحوبات</div>
          </div>
          <div class="stat ${net >= 0 ? 'income' : 'expense'}">
            <div class="num">${fmt(net)}</div>
            <div class="lbl">صافي</div>
          </div>
        </div>
      `;

      if (sorted.length > 0) {
        html += `
          <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow-sm);">
            <div style="font-weight:800;color:var(--ink);font-size:14px;margin-bottom:14px;">📊 التوزيع حسب السبب</div>
            ${sorted.map(([r, amt]) => {
              const info = reasonInfo(r);
              const pct = (amt / maxAmt) * 100;
              return `
                <div style="margin-bottom:12px;">
                  <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px;">
                    <span style="color:var(--muted);">${info?.icon || ''} ${info?.label || r}</span>
                    <span style="color:var(--ink);">${fmt(amt)}</span>
                  </div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width:${Math.min(pct, 100)}%;"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        html += `
          <div class="empty">
            <span class="empty-ico">📊</span>
            <h3>لا توجد بيانات</h3>
            <p>أضف معاملات لعرض التقارير</p>
          </div>
        `;
      }

      html += `
        <button class="btn btn-primary btn-block btn-lg" onclick="exportData()">📤 تصدير البيانات</button>
      `;

      return html;
    }

    // ============================================================
    // المودالات
    // ============================================================
    function renderModals() {
      $$('.modal').forEach(el => el.remove());
      if (modals.createAccount) renderCreateAccountModal();
      if (modals.addTransaction) renderAddTransactionModal();
      if (modals.transfer) renderTransferModal();
      if (modals.settings) renderSettingsModal();
      if (modals.editTransaction) renderEditTransactionModal();
      if (modals.editAccount) renderEditAccountModal();
    }

    function renderCreateAccountModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal';
      overlay.onclick = (e) => { if (e.target === overlay) closeModal('createAccount'); };
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-head">
            <h2 class="sheet-title">✨ حساب جديد</h2>
            <button class="sheet-close" onclick="closeModal('createAccount')">✕</button>
          </div>
          <div class="field">
            <label class="field-label">اسم الحساب</label>
            <input class="input" id="acc-name" placeholder="مثال: محفظتي الشخصية">
          </div>
          <div class="field">
            <label class="field-label">العملات</label>
            <div id="acc-currency-picker" class="grid-3">
              ${CURRENCIES.map(c => `
                <button class="cur-btn" data-cur="${c.value}" onclick="toggleCurIOS(this,'${c.value}')" style="justify-content:center;">
                  ${c.flag} ${c.symbol}
                </button>
              `).join('')}
            </div>
          </div>
          <div id="acc-balances" style="display:none;margin-bottom:14px;"></div>
          <div class="field">
            <label class="field-label">الأيقونة</label>
            <div class="grid-6">
              ${ACCOUNT_ICONS.map((ic, i) => `
                <button class="opt-btn ${i === 0 ? 'active' : ''}" data-icon="${i}" onclick="selectIconIOS(this,${i})">${ic}</button>
              `).join('')}
            </div>
          </div>
          <div class="field">
            <label class="field-label">اللون</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${ACCOUNT_COLORS.map((col, i) => `
                <button class="color-dot ${i === 0 ? 'active' : ''}" data-color="${i}" style="background:${col};" onclick="selectColorIOS(${i})"></button>
              `).join('')}
            </div>
          </div>
          <button class="btn btn-primary btn-block btn-lg mt-3" onclick="submitCreateIOS()">إنشاء الحساب</button>
        </div>
      `;
      document.body.appendChild(overlay);
      window._createIOS = { currencies: [], icon: 0, color: 0 };
    }

    window.toggleCurIOS = function(el, cur) {
      const s = window._createIOS;
      const idx = s.currencies.indexOf(cur);
      if (idx > -1) s.currencies.splice(idx, 1);
      else s.currencies.push(cur);
      $$('[data-cur]').forEach(b => {
        const v = b.dataset.cur;
        b.classList.toggle('active', s.currencies.includes(v));
      });
      const cont = $('#acc-balances');
      if (s.currencies.length > 0) {
        cont.style.display = 'block';
        cont.innerHTML = s.currencies.map(c => {
          const info = curInfo(c);
          return `<div class="field" style="margin-bottom:10px;">
            <label class="field-label">رصيد ${info?.label} (${info?.symbol})</label>
            <input class="input" id="bal-${c}" type="number" placeholder="0.00" value="0">
          </div>`;
        }).join('');
      } else {
        cont.style.display = 'none';
      }
    };

    window.selectIconIOS = function(el, i) {
      window._createIOS.icon = i;
      $$('[data-icon]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.icon) === i));
    };

    window.selectColorIOS = function(i) {
      window._createIOS.color = i;
      $$('[data-color]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.color) === i));
    };

    window.submitCreateIOS = function() {
      const s = window._createIOS;
      const name = $('#acc-name').value.trim();
      if (!name) { showToast('❌ أدخل اسم الحساب', 'error'); return; }
      if (s.currencies.length === 0) { showToast('❌ اختر عملة واحدة على الأقل', 'error'); return; }
      const currencies = {};
      s.currencies.forEach(c => {
        const inp = $(`#bal-${c}`);
        currencies[c] = parseFloat(inp?.value) || 0;
      });
      addAccount({ name, currencies, icon: ACCOUNT_ICONS[s.icon], color: ACCOUNT_COLORS[s.color] });
    };

    window.openTxModal = function(type, accountId) {
      txStep = 1;
      txData = { type: type || 'deposit', accountId: accountId || '', currency: 'USD', reason: '', amount: 0, note: '', toAccountId: '', exchangeRate: 0 };
      openModal('addTransaction');
    };

    function renderAddTransactionModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal';
      overlay.onclick = (e) => { if (e.target === overlay) closeModal('addTransaction'); };
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-head">
            <h2 class="sheet-title">📝 معاملة جديدة</h2>
            <button class="sheet-close" onclick="closeModal('addTransaction')">✕</button>
          </div>
          <div id="tx-content">${renderTxStepIOS()}</div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function renderTxStepIOS() {
      const steps = ['النوع', 'الحساب', 'العملة', 'السبب', 'المبلغ'];
      const current = txStep;
      const data = txData;

      let html = `
        <div class="steps">
          ${steps.map((s, i) => `<div class="step-dot ${i + 1 < current ? 'done' : i + 1 === current ? 'active' : ''}"></div>`).join('')}
        </div>
        <div class="step-label">${steps[current - 1]}</div>
      `;

      switch (current) {
        case 1:
          html += `
            <div class="grid-3">
              <button class="opt-btn ${data.type === 'deposit' ? 'active' : ''}" style="flex-direction:column;padding:16px 8px;gap:6px;height:auto;" onclick="setTxTypeIOS('deposit')">
                <div style="font-size:28px;">📥</div>
                <div style="font-weight:700;font-size:12px;color:var(--ink);">إيداع</div>
              </button>
              <button class="opt-btn ${data.type === 'withdraw' ? 'active' : ''}" style="flex-direction:column;padding:16px 8px;gap:6px;height:auto;" onclick="setTxTypeIOS('withdraw')">
                <div style="font-size:28px;">📤</div>
                <div style="font-weight:700;font-size:12px;color:var(--ink);">سحب</div>
              </button>
              <button class="opt-btn ${data.type === 'transfer' ? 'active' : ''}" style="flex-direction:column;padding:16px 8px;gap:6px;height:auto;" onclick="setTxTypeIOS('transfer')">
                <div style="font-size:28px;">🔄</div>
                <div style="font-weight:700;font-size:12px;color:var(--ink);">تحويل</div>
              </button>
            </div>
          `;
          break;
        case 2:
          html += `
            <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;">
              ${state.accounts.map(a => `
                <button class="opt-btn ${data.accountId === a.id ? 'active' : ''}" style="padding:12px 14px;text-align:right;justify-content:flex-start;flex-direction:column;align-items:flex-start;gap:2px;height:auto;" onclick="setTxAccountIOS('${a.id}')">
                  <div style="font-weight:700;font-size:14px;color:var(--ink);">${a.icon || ''} ${a.name}</div>
                  <div style="font-size:11px;color:var(--muted);">
                    ${Object.entries(a.currencies || {}).filter(([,v]) => v !== 0).map(([c, v]) => `${curInfo(c)?.flag || ''} ${fmt(v)}`).join(' · ') || 'لا توجد أرصدة'}
                  </div>
                </button>
              `).join('')}
            </div>
          `;
          break;
        case 3:
          const acc = getAccount(data.accountId);
          const allCurrencies = acc ? Object.keys(acc.currencies || {}) : [];
          const showCurrencies = allCurrencies.length > 0 ? allCurrencies : CURRENCIES.map(c => c.value);
          html += `
            <div class="grid-3">
              ${CURRENCIES.filter(c => showCurrencies.includes(c.value)).map(c => `
                <button class="opt-btn ${data.currency === c.value ? 'active' : ''}" style="flex-direction:column;padding:12px 6px;gap:4px;height:auto;" onclick="setTxCurrencyIOS('${c.value}')">
                  <div style="font-size:26px;">${c.flag}</div>
                  <div style="font-size:12px;font-weight:800;color:var(--ink);">${c.symbol}</div>
                  <div style="font-size:10px;color:var(--muted);">${fmt(acc?.currencies?.[c.value] || 0)}</div>
                </button>
              `).join('')}
            </div>
          `;
          break;
        case 4:
          html += `
            <div class="grid-2">
              ${REASONS.map(r => `
                <button class="opt-btn ${data.reason === r.value ? 'active' : ''}" style="flex-direction:column;padding:12px 8px;gap:4px;height:auto;" onclick="setTxReasonIOS('${r.value}')">
                  <div style="font-size:24px;">${r.icon}</div>
                  <div style="font-size:12px;font-weight:700;color:var(--ink);">${r.label}</div>
                </button>
              `).join('')}
            </div>
          `;
          break;
        case 5:
          const info = curInfo(data.currency);
          html += `
            <div class="field">
              <label class="field-label">المبلغ (${info?.symbol || ''})</label>
              <input class="input" id="tx-amount-ios" type="number" placeholder="0.00" style="font-size:20px;padding:16px;font-weight:800;text-align:center;">
            </div>
            <div class="field">
              <label class="field-label">ملاحظة (اختياري)</label>
              <input class="input" id="tx-note-ios" placeholder="أضف ملاحظة...">
            </div>
            <button class="btn btn-success btn-block btn-lg" onclick="submitTxIOS()">✅ تأكيد المعاملة</button>
          `;
          break;
      }

      if (current < 5 && current > 0) {
        html += `
          <div style="display:flex;gap:8px;margin-top:16px;">
            ${current > 1 ? `<button class="btn btn-ghost" style="flex:1;" onclick="txStep--;renderTxContentIOS()">← رجوع</button>` : ''}
            <button class="btn btn-primary" style="flex:1;" onclick="txStep++;renderTxContentIOS()">التالي →</button>
          </div>
        `;
      }

      return html;
    }

    window.renderTxContentIOS = function() {
      const container = $('#tx-content');
      if (container) container.innerHTML = renderTxStepIOS();
    };

    window.setTxTypeIOS = function(type) {
      txData.type = type;
      txStep = 2;
      renderTxContentIOS();
    };

    window.setTxAccountIOS = function(id) {
      txData.accountId = id;
      const acc = getAccount(id);
      if (acc) {
        const keys = Object.keys(acc.currencies || {});
        if (keys.length > 0) txData.currency = keys[0];
      }
      txStep = 3;
      renderTxContentIOS();
    };

    window.setTxCurrencyIOS = function(cur) {
      txData.currency = cur;
      txStep = 4;
      renderTxContentIOS();
    };

    window.setTxReasonIOS = function(reason) {
      txData.reason = reason;
      txStep = 5;
      renderTxContentIOS();
    };

    window.submitTxIOS = function() {
      const data = txData;
      const amount = parseFloat($('#tx-amount-ios')?.value);
      if (!data.accountId) { showToast('❌ اختر الحساب', 'error'); return; }
      if (!data.reason && data.type !== 'transfer') { showToast('❌ اختر السبب', 'error'); return; }
      if (!amount || amount === 0) { showToast('❌ أدخل مبلغ صحيح', 'error'); return; }
      data.note = $('#tx-note-ios')?.value || '';
      data.amount = amount;
      addTransaction(data);
      closeModal('addTransaction');
      txStep = 1;
      txData = { type: 'deposit', accountId: '', currency: 'USD', reason: '', amount: 0, note: '', toAccountId: '', exchangeRate: 0 };
      renderAll();
    };

    // ============================================================
    // مودال التحويل
    // ============================================================
    function renderTransferModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal';
      overlay.onclick = (e) => { if (e.target === overlay) closeModal('transfer'); };
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-head">
            <h2 class="sheet-title">🔄 تحويل بين الحسابات</h2>
            <button class="sheet-close" onclick="closeModal('transfer')">✕</button>
          </div>
          <div class="field">
            <label class="field-label">من حساب</label>
            <select class="input" id="tf-from" onchange="updateTransferIOS()">
              <option value="">اختر الحساب</option>
              ${state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
            </select>
            <div id="tf-from-currencies" style="margin-top:8px;"></div>
          </div>
          <div style="text-align:center;font-size:20px;color:var(--brand);margin:4px 0;">⬇</div>
          <div class="field">
            <label class="field-label">إلى حساب</label>
            <select class="input" id="tf-to" onchange="updateTransferIOS()">
              <option value="">اختر الحساب</option>
              ${state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
            </select>
            <div id="tf-to-currencies" style="margin-top:8px;"></div>
          </div>
          <div id="tf-details" style="display:none;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
              <div class="field" style="margin-bottom:0;">
                <label class="field-label">المبلغ</label>
                <input class="input" id="tf-amount" type="number" placeholder="0.00" oninput="updateTransferIOS()">
              </div>
              <div class="field" id="tf-rate-container" style="margin-bottom:0;display:none;">
                <label class="field-label">سعر التحويل</label>
                <input class="input" id="tf-rate" type="number" placeholder="32.50" oninput="updateTransferIOS()">
              </div>
            </div>
            <div id="tf-rate-label" style="font-size:11px;color:var(--muted);margin-top:4px;text-align:center;"></div>
            <div class="preview-box">
              <div class="preview-label">معاينة التحويل</div>
              <div class="preview-flow">
                <span class="preview-amt from" id="tf-from-amt">0.00</span>
                <span style="color:var(--brand);font-size:18px;">→</span>
                <span class="preview-amt to" id="tf-to-amt">0.00</span>
              </div>
            </div>
            <div id="tf-warning" style="display:none;margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);font-size:12px;color:#d97706;font-weight:600;text-align:center;"></div>
            <button class="btn btn-success btn-block btn-lg mt-3" onclick="submitTransferIOS()">✅ تأكيد التحويل</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function renderCurrencies(accountId, containerId, selectedCur) {
      const container = $(`#${containerId}`);
      if (!container) return;
      const acc = getAccount(accountId);
      if (!acc) { container.innerHTML = ''; return; }

      const allCurrencies = Object.keys(acc.currencies || {});
      if (allCurrencies.length === 0) {
        container.innerHTML = '<span style="font-size:12px;color:var(--muted);">لا توجد عملات - أضف عملة من تعديل الحساب</span>';
        return;
      }

      let html = '<div class="cur-selector">';
      allCurrencies.forEach(c => {
        const info = curInfo(c);
        const bal = acc.currencies[c] || 0;
        const isActive = c === selectedCur;
        html += `
          <button class="cur-btn ${isActive ? 'active' : ''}" onclick="selectTransferCurrency('${containerId}', '${c}')">
            ${info?.flag || ''} ${info?.symbol || c}
            <span style="font-size:10px;color:${bal < 0 ? 'var(--danger)' : 'var(--muted)'};font-weight:700;">${fmt(bal)}</span>
          </button>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    window.selectTransferCurrency = function(containerId, currency) {
      if (containerId === 'tf-from-currencies') {
        transferData.fromCurrency = currency;
      } else if (containerId === 'tf-to-currencies') {
        transferData.toCurrency = currency;
      }
      updateTransferIOS();
    };

    window.updateTransferIOS = function() {
      const from = $('#tf-from')?.value;
      const to = $('#tf-to')?.value;
      const details = $('#tf-details');

      if (from) {
        const acc = getAccount(from);
        const keys = Object.keys(acc?.currencies || {});
        if (keys.length > 0 && (!transferData.fromCurrency || !keys.includes(transferData.fromCurrency))) {
          transferData.fromCurrency = keys[0];
        }
        renderCurrencies(from, 'tf-from-currencies', transferData.fromCurrency);
      }
      if (to) {
        const acc = getAccount(to);
        const keys = Object.keys(acc?.currencies || {});
        if (keys.length > 0 && (!transferData.toCurrency || !keys.includes(transferData.toCurrency))) {
          transferData.toCurrency = keys[0];
        }
        renderCurrencies(to, 'tf-to-currencies', transferData.toCurrency);
      }

      if (from && to && from !== to) {
        details.style.display = 'block';

        const amount = parseFloat($('#tf-amount')?.value) || 0;
        const rate = parseFloat($('#tf-rate')?.value) || 0;

        const fCur = transferData.fromCurrency || 'USD';
        const tCur = transferData.toCurrency || 'USD';
        const fInfo = curInfo(fCur);
        const tInfo = curInfo(tCur);

        const rateContainer = $('#tf-rate-container');
        const isSameCurrency = fCur === tCur;

        if (isSameCurrency) {
          rateContainer.style.display = 'none';
          $('#tf-from-amt').textContent = `${fInfo?.symbol || ''}${fmt(amount)}`;
          $('#tf-to-amt').textContent = `${tInfo?.symbol || ''}${fmt(amount)}`;
          transferData.exchangeRate = 0;
          transferData.convertedAmount = amount;
        } else {
          rateContainer.style.display = 'block';
          const rateLabel = $('#tf-rate-label');
          if (rateLabel) rateLabel.textContent = `1 ${fCur} = ? ${tCur}`;
          const converted = amount * rate;
          $('#tf-from-amt').textContent = `${fInfo?.symbol || ''}${fmt(amount)}`;
          $('#tf-to-amt').textContent = `${tInfo?.symbol || ''}${fmt(converted)}`;
          transferData.exchangeRate = rate;
          transferData.convertedAmount = converted;
        }

        const fromAcc = getAccount(from);
        const bal = fromAcc?.currencies?.[fCur] || 0;
        const warning = $('#tf-warning');
        if (amount > bal && warning) {
          warning.style.display = 'block';
          warning.innerHTML = `⚠️ الرصيد الحالي: ${fInfo?.symbol || ''}${fmt(bal)} — سيصبح الرصيد سالباً بعد التحويل (${fInfo?.symbol || ''}${fmt(bal - amount)})`;
        } else if (warning) {
          warning.style.display = 'none';
        }

        transferData.fromAccountId = from;
        transferData.toAccountId = to;
        transferData.fromCurrency = fCur;
        transferData.toCurrency = tCur;
        transferData.amount = amount;
      } else {
        details.style.display = 'none';
      }
    };

    window.submitTransferIOS = function() {
      const data = transferData;
      if (!data.fromAccountId || !data.toAccountId) { showToast('❌ اختر الحسابات', 'error'); return; }
      if (data.fromAccountId === data.toAccountId) { showToast('❌ لا يمكن التحويل لنفس الحساب', 'error'); return; }
      if (!data.amount || data.amount === 0) { showToast('❌ أدخل مبلغ صحيح', 'error'); return; }

      if (data.fromCurrency !== data.toCurrency && (!data.exchangeRate || data.exchangeRate <= 0)) {
        showToast('❌ أدخل سعر تحويل صحيح', 'error');
        return;
      }

      const fromAcc = getAccount(data.fromAccountId);
      addTransaction({
        type: 'transfer',
        accountId: data.fromAccountId,
        toAccountId: data.toAccountId,
        currency: data.fromCurrency,
        toCurrency: data.toCurrency,
        amount: data.amount,
        exchangeRate: data.fromCurrency !== data.toCurrency ? data.exchangeRate : null,
        reason: 'other',
        note: `تحويل من ${fromAcc?.name || ''}`,
      });

      closeModal('transfer');
      transferData = { fromAccountId: '', toAccountId: '', fromCurrency: 'USD', toCurrency: 'USD', amount: 0, exchangeRate: 0, convertedAmount: 0 };
      renderAll();
    };

    // ============================================================
    // تعديل معاملة
    // ============================================================
    window.openEditTransaction = function(id) {
      editingTxId = id;
      const tx = getTransaction(id);
      if (!tx) return;
      openModal('editTransaction');
    };

    function renderEditTransactionModal() {
      const tx = getTransaction(editingTxId);
      if (!tx) { closeModal('editTransaction'); return; }

      const overlay = document.createElement('div');
      overlay.className = 'modal';
      overlay.onclick = (e) => { if (e.target === overlay) closeModal('editTransaction'); };
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-head">
            <h2 class="sheet-title">✎ تعديل المعاملة</h2>
            <button class="sheet-close" onclick="closeModal('editTransaction')">✕</button>
          </div>
          <div class="field">
            <label class="field-label">النوع</label>
            <select class="input" id="edit-tx-type">
              <option value="deposit" ${tx.type === 'deposit' ? 'selected' : ''}>📥 إيداع</option>
              <option value="withdraw" ${tx.type === 'withdraw' ? 'selected' : ''}>📤 سحب</option>
              <option value="transfer" ${tx.type === 'transfer' ? 'selected' : ''}>🔄 تحويل</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label">الحساب</label>
            <select class="input" id="edit-tx-account">
              ${state.accounts.map(a => `<option value="${a.id}" ${tx.accountId === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">العملة</label>
            <select class="input" id="edit-tx-currency">
              ${CURRENCIES.map(c => `<option value="${c.value}" ${tx.currency === c.value ? 'selected' : ''}>${c.flag} ${c.label} (${c.symbol})</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">السبب</label>
            <select class="input" id="edit-tx-reason">
              ${REASONS.map(r => `<option value="${r.value}" ${tx.reason === r.value ? 'selected' : ''}>${r.icon} ${r.label}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">المبلغ</label>
            <input class="input" id="edit-tx-amount" type="number" value="${tx.amount}">
          </div>
          <div class="field">
            <label class="field-label">ملاحظة</label>
            <input class="input" id="edit-tx-note" value="${tx.note || ''}" placeholder="اختياري">
          </div>
          ${tx.type === 'transfer' ? `
            <div class="field">
              <label class="field-label">إلى حساب</label>
              <select class="input" id="edit-tx-to">
                <option value="">اختر حساب</option>
                ${state.accounts.filter(a => a.id !== tx.accountId).map(a => `<option value="${a.id}" ${tx.toAccountId === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label class="field-label">سعر التحويل (إذا كانت العملة مختلفة)</label>
              <input class="input" id="edit-tx-rate" type="number" value="${tx.exchangeRate || ''}" placeholder="32.50">
            </div>
          ` : ''}
          <button class="btn btn-success btn-block btn-lg mt-3" onclick="submitEditTransaction()">💾 حفظ التعديل</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    window.submitEditTransaction = function() {
      const type = $('#edit-tx-type')?.value;
      const accountId = $('#edit-tx-account')?.value;
      const currency = $('#edit-tx-currency')?.value;
      const reason = $('#edit-tx-reason')?.value;
      const amount = parseFloat($('#edit-tx-amount')?.value);
      const note = $('#edit-tx-note')?.value || '';
      const toAccountId = $('#edit-tx-to')?.value || null;
      const rate = parseFloat($('#edit-tx-rate')?.value) || 0;

      if (!accountId) { showToast('❌ اختر الحساب', 'error'); return; }
      if (!amount || amount === 0) { showToast('❌ أدخل مبلغ صحيح', 'error'); return; }

      const data = { type, accountId, currency, reason, amount, note, toAccountId, exchangeRate: rate };
      if (type === 'transfer') {
        const toAcc = getAccount(toAccountId);
        if (toAcc) {
          const keys = Object.keys(toAcc.currencies || {});
          data.toCurrency = keys.length > 0 ? keys[0] : 'USD';
        }
      }

      updateTransaction(editingTxId, data);
    };

    // ============================================================
    // تعديل حساب
    // ============================================================
    window.openEditAccount = function(id) {
      editingAccountId = id;
      openModal('editAccount');
    };

    function renderEditAccountModal() {
      const acc = getAccount(editingAccountId);
      if (!acc) { closeModal('editAccount'); return; }

      const overlay = document.createElement('div');
      overlay.className = 'modal';
      overlay.onclick = (e) => { if (e.target === overlay) closeModal('editAccount'); };
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-head">
            <h2 class="sheet-title">✎ تعديل الحساب</h2>
            <button class="sheet-close" onclick="closeModal('editAccount')">✕</button>
          </div>
          <div class="field">
            <label class="field-label">اسم الحساب</label>
            <input class="input" id="edit-acc-name" value="${acc.name}">
          </div>
          <div class="field">
            <label class="field-label">الأيقونة</label>
            <div class="grid-6">
              ${ACCOUNT_ICONS.map((ic, i) => `
                <button class="opt-btn ${acc.icon === ic ? 'active' : ''}" data-icon="${i}" onclick="selectEditIcon(this,${i})">${ic}</button>
              `).join('')}
            </div>
          </div>
          <div class="field">
            <label class="field-label">اللون</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${ACCOUNT_COLORS.map((col, i) => `
                <button class="color-dot ${acc.color === col ? 'active' : ''}" data-color="${i}" style="background:${col};" onclick="selectEditColor(this,${i})"></button>
              `).join('')}
            </div>
          </div>
          <div class="field">
            <label class="field-label">تعديل الأرصدة</label>
            ${CURRENCIES.filter(c => acc.currencies?.[c.value] !== undefined).map(c => `
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                <span style="font-size:18px;width:30px;">${c.flag}</span>
                <input class="input" id="edit-bal-${c.value}" type="number" value="${acc.currencies[c.value] || 0}" style="flex:1;">
              </div>
            `).join('')}
            ${CURRENCIES.filter(c => acc.currencies?.[c.value] === undefined).map(c => `
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 0;">
                <span style="font-size:18px;width:30px;">${c.flag}</span>
                <span style="flex:1;font-size:13px;color:var(--muted);">${c.label} - غير مضاف</span>
                <button class="btn btn-ghost btn-sm" onclick="addCurrencyToAccount('${editingAccountId}','${c.value}')">+ إضافة</button>
              </div>
            `).join('')}
          </div>
          <button class="btn btn-success btn-block btn-lg mt-3" onclick="submitEditAccount()">💾 حفظ التعديلات</button>
        </div>
      `;
      document.body.appendChild(overlay);
      window._editIcon = acc.icon;
      window._editColor = acc.color;
    }

    window.selectEditIcon = function(el, i) {
      window._editIcon = ACCOUNT_ICONS[i];
      $$('[data-icon]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.icon) === i));
    };

    window.selectEditColor = function(el, i) {
      window._editColor = ACCOUNT_COLORS[i];
      $$('[data-color]').forEach(b => b.classList.toggle('active', parseInt(b.dataset.color) === i));
    };

    window.addCurrencyToAccount = function(accountId, currency) {
      const acc = getAccount(accountId);
      if (!acc) return;
      acc.currencies[currency] = 0;
      saveData();
      closeModal('editAccount');
      setTimeout(() => openEditAccount(accountId), 100);
      showToast(`✅ تم إضافة ${curInfo(currency)?.label || currency}`);
    };

    window.submitEditAccount = function() {
      const acc = getAccount(editingAccountId);
      if (!acc) return;
      const name = $('#edit-acc-name')?.value.trim() || acc.name;
      const icon = window._editIcon || acc.icon;
      const color = window._editColor || acc.color;
      const currencies = {};
      CURRENCIES.forEach(c => {
        const inp = $(`#edit-bal-${c.value}`);
        if (inp) currencies[c.value] = parseFloat(inp.value) || 0;
        else if (acc.currencies?.[c.value] !== undefined) currencies[c.value] = acc.currencies[c.value];
      });
      updateAccount(editingAccountId, { name, currencies, icon, color });
    };

    // ============================================================
    // الإعدادات
    // ============================================================
    function renderSettingsModal() {
      const overlay = document.createElement('div');
      overlay.className = 'modal';
      overlay.onclick = (e) => { if (e.target === overlay) closeModal('settings'); };
      overlay.innerHTML = `
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="sheet-head">
            <h2 class="sheet-title">⚙️ الإعدادات</h2>
            <button class="sheet-close" onclick="closeModal('settings')">✕</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="opt-btn" style="padding:14px 16px;justify-content:flex-start;gap:12px;text-align:right;height:auto;" onclick="closeModal('settings');exportData();">
              <span style="font-size:24px;">📤</span>
              <div style="flex:1;text-align:right;">
                <div style="font-weight:700;font-size:14px;color:var(--ink);">تصدير البيانات</div>
                <div style="font-size:11px;color:var(--muted);font-weight:500;">نسخة احتياطية بصيغة JSON</div>
              </div>
            </button>
            <button class="opt-btn" style="padding:14px 16px;justify-content:flex-start;gap:12px;text-align:right;height:auto;" onclick="closeModal('settings');triggerImport();">
              <span style="font-size:24px;">📥</span>
              <div style="flex:1;text-align:right;">
                <div style="font-weight:700;font-size:14px;color:var(--ink);">استيراد البيانات</div>
                <div style="font-size:11px;color:var(--muted);font-weight:500;">استعادة من ملف JSON</div>
              </div>
            </button>
            <div style="padding:14px;border-radius:14px;background:rgba(99,102,241,0.06);text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin-top:8px;">
              TAREK · ${state.accounts.length} حساب · ${state.transactions.length} معاملة
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    // ============================================================
    // التنقل
    // ============================================================
    window.switchTab = function(tab) {
      currentTab = tab;
      selectedAccountId = null;
      renderAll();
    };

    window.selectAccount = function(id) {
      selectedAccountId = id;
      renderAll();
    };

    // ============================================================
    // البدء
    // ============================================================
    loadData();
    renderAll();

    console.log('%c🎯 TAREK - إدارة مالية احترافية', 'color:#6366f1;font-size:16px;font-weight:bold;');
    console.log(`📊 ${state.accounts.length} حسابات، ${state.transactions.length} معاملات`);
    console.log('✨ شريط التنقل السفلي يحتوي الآن على 5 أزرار: الرئيسية، المعاملات، +، ⇄، التقارير');
  </script>

</body>
</html>
